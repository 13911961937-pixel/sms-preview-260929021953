  S.registerSeed('dailyOps', dailyOps);
  S.registerSeed('loginLogs', []);
})();


/* ===== modules/dashboard.js ===== */
/* =====================================================================
   modules/dashboard.js — 首页（D17）：公司级 / 部门级可视化看板
   数据均由 store 现算；外部接口（A-CDM）使用预置模拟数据并标注。
   ===================================================================== */
(function () {
  'use strict';
  const SMS = window.SMS, S = SMS.store, U = SMS.util, ui = SMS.ui;
  const el = U.el;
  const curMonth = U.today().slice(0, 7);
  const yesterday = U.fmtDate(U.addDays(new Date(), -1));

  const deptName = id => { const d = S.get('departments', id); return d ? d.name : '—'; };

  /* 数据范围切片 */
  function scope(rows, deptField, isCompany) {
    if (isCompany) return rows;
    const d = SMS.auth.scopeDept();
    if (d == null) return rows;
    return rows.filter(r => r[deptField] === d || r.respDeptId === d);
  }

  function build(isCompany) {
    const root = el('div');
    const after = [];

    const hazards = scope(S.all('hazards'), 'deptId', isCompany);
    const hds = scope(S.all('hiddenDangers'), 'respDeptId', isCompany);
    const vrs = scope(S.all('voluntaryReports'), 'deptId', isCompany);
    const mrs = scope(S.all('mandatoryReports'), 'deptId', isCompany);

    /* ---------- 顶部数据卡 ---------- */
    const existHD = hds.filter(h => h.status !== '已关闭');
    const hdNewMonth = hds.filter(h => h.foundDate.slice(0, 7) === curMonth);
    const hzNewMonth = hazards.filter(h => h.foundDate.slice(0, 7) === curMonth);
    const vrYear = vrs.filter(r => r.reportDate.slice(0, 4) === U.today().slice(0, 4));
    const vrYesterday = vrs.filter(r => r.reportDate === yesterday);
    const opsMonth = S.all('dailyOps').filter(d => d.date.slice(0, 7) === curMonth);
    const flightsMonth = U.sum(opsMonth, d => d.flights);
    const paxMonth = U.sum(opsMonth, d => d.pax);

    const statRow = el('div', { class: 'grid g4' }, [
      ui.statCard({ icon: 'alert', tone: 'var(--danger)', toneBg: 'var(--danger-soft)', value: existHD.length, label: '现存隐患', sub: '本月新增 ' + hdNewMonth.length + ' 项', dir: hdNewMonth.length ? 'up' : '' }),
      ui.statCard({ icon: 'shield', tone: 'var(--brand)', toneBg: 'var(--brand-soft)', value: hazards.length, label: '现存危险源', sub: '本月新增 ' + hzNewMonth.length + ' 项', dir: hzNewMonth.length ? 'up' : '' }),
      ui.statCard({ icon: 'send', tone: 'var(--teal)', toneBg: 'var(--teal-soft)', value: vrYear.length, label: '当年自愿报告', sub: '昨日新增 ' + vrYesterday.length + ' 项' }),
      ui.statCard({ icon: 'plane', tone: 'var(--accent)', toneBg: 'var(--accent-soft)', value: flightsMonth, label: '本月航班架次', sub: '吞吐量 ' + U.fmtNum(paxMonth) + ' 人次' })
    ]);
    root.appendChild(statRow);

    /* ---------- 关键 KPI ---------- */
    const adopted = vrs.filter(r => r.adopted === '是');
    const adoptRate = U.pct(adopted.length, vrs.length);
    const closedHD = hds.filter(h => h.status === '已关闭');
    const closeRate = U.pct(closedHD.length, hds.length);

    const inspTasks = scope(S.all('inspectionTasks'), 'deptId', isCompany);
    const inspDone = inspTasks.filter(t => t.status === '已完成');
    const inspRate = inspTasks.length ? U.pct(inspDone.length, inspTasks.length) : null;

    const capa = scope(S.all('correctiveActions'), 'respDeptId', isCompany);
    const capaDone = capa.filter(c => c.status === '已验证');
    const capaRate = capa.length ? U.pct(capaDone.length, capa.length) : null;

    function kpiCard(label, value, tone) {
      return el('div', { class: 'card' }, [
        el('div', { class: 'card-b', style: { padding: '13px 16px' } }, [
          el('div', { class: 'small muted', text: label }),
          el('div', { style: { fontSize: '22px', fontWeight: '700', color: tone || 'var(--brand-dark)', margin: '4px 0 7px' }, text: value == null ? '—' : value + '%' }),
          ui.progress(value == null ? 0 : value, value >= 90 ? 'ok' : value >= 70 ? 'warn' : 'danger')
        ])
      ]);
    }
    const kpiRow = el('div', { class: 'grid g4 mt' }, [
      kpiCard('自愿报告采纳率', adoptRate, 'var(--teal)'),
      kpiCard('检查任务完成率', inspRate, 'var(--brand)'),
      kpiCard('隐患整改关闭率', closeRate, 'var(--accent)'),
      kpiCard('跟踪验证闭环率', capaRate, 'var(--info)')
    ]);
    root.appendChild(kpiRow);

    /* ---------- 图表行 1 ---------- */
    const chartRow1 = el('div', { class: 'grid g2 mt' });
    // 自愿报告：报告/采纳（按月）
    const c1 = chartCard('自愿报告采纳情况（按月）', 'chart-vr');
    chartRow1.appendChild(c1.card);
    after.push(() => {
      const months = ['05', '06', '07', '08', '09'];
      const rep = months.map(m => vrs.filter(r => r.reportDate.slice(5, 7) === m).length);
      const adp = months.map(m => vrs.filter(r => r.reportDate.slice(5, 7) === m && r.adopted === '是').length);
      ui.chart(c1.body, ui.baseOption({
        legend: { top: 4, data: ['报告数', '采纳数'] },
        xAxis: { type: 'category', data: months.map(m => m + '月') },
        yAxis: { type: 'value', minInterval: 1 },
        series: [
          { name: '报告数', type: 'bar', data: rep, itemStyle: { color: '#1F4E79' }, barMaxWidth: 26 },
          { name: '采纳数', type: 'bar', data: adp, itemStyle: { color: '#2E6B5E' }, barMaxWidth: 26 }
        ]
      }));
    });
    // 强制报告：紧急/非紧急
    const c2 = chartCard('强制报告数量（紧急/非紧急）', 'chart-mr');
    chartRow1.appendChild(c2.card);
    after.push(() => {
      const urgent = mrs.filter(r => r.urgent === '是').length;
      const normal = mrs.filter(r => r.urgent === '否').length;
      ui.chart(c2.body, ui.baseOption({
        tooltip: { trigger: 'item' }, legend: { top: 4 },
        series: [{
          type: 'pie', radius: ['42%', '66%'], center: ['50%', '56%'],
          data: [{ name: '紧急事件', value: urgent, itemStyle: { color: '#C0392B' } }, { name: '非紧急事件', value: normal, itemStyle: { color: '#2E75B6' } }],
          label: { formatter: '{b}: {c}' }
        }]
      }));
    });
    root.appendChild(chartRow1);

    /* ---------- 图表行 2 ---------- */
    const chartRow2 = el('div', { class: 'grid g2 mt' });
    // 危险源等级分布
    const c3 = chartCard('危险源识别（风险等级分布）', 'chart-hz');
    chartRow2.appendChild(c3.card);
    after.push(() => {
      const levels = ['可忽略', '低度', '中度', '高度', '不可接受'];
      const data = levels.map(l => ({ name: l, value: hazards.filter(h => h.level === l).length, itemStyle: { color: ui.LEVEL_COLORS[l] } }));
      ui.chart(c3.body, ui.baseOption({
        tooltip: { trigger: 'item' }, legend: { top: 4 },
        series: [{ type: 'pie', radius: '62%', center: ['50%', '56%'], data, label: { formatter: '{b} {c}' } }]
      }));
    });
    // 隐患：一般/重大
    const c4 = chartCard('隐患管理（一般/重大）', 'chart-hd');
    chartRow2.appendChild(c4.card);
    after.push(() => {
      const general = hds.filter(h => h.level === '一般隐患');
      const major = hds.filter(h => h.level === '重大隐患');
      ui.chart(c4.body, ui.baseOption({
        legend: { top: 4, data: ['一般隐患', '重大隐患'] },
        xAxis: { type: 'category', data: ['总览', '整改中', '已关闭'] },
        yAxis: { type: 'value', minInterval: 1 },
        series: [
          { name: '一般隐患', type: 'bar', stack: 'a', data: [general.length, general.filter(h => h.status !== '已关闭').length, general.filter(h => h.status === '已关闭').length], itemStyle: { color: '#E0A024' }, barMaxWidth: 40 },
          { name: '重大隐患', type: 'bar', stack: 'a', data: [major.length, major.filter(h => h.status !== '已关闭').length, major.filter(h => h.status === '已关闭').length], itemStyle: { color: '#C0392B' }, barMaxWidth: 40 }
        ]
      }));
    });
    root.appendChild(chartRow2);

    /* ---------- 通告 / 风险提示 ---------- */
    const row3 = el('div', { class: 'grid g2 mt' });
    // 安全通告
    const ntCard = el('div', { class: 'card' }, [
      el('div', { class: 'card-h' }, [el('div', { class: 't', html: ui.icon('bell') + ' 安全通告' }), el('a', { class: 'small', text: '更多' })]),
      el('div', { class: 'card-b' }, [noticeFeed(S.all('notices').slice(0, 6))])
    ]);
    row3.appendChild(ntCard);
    // 风险提示
    const warnHz = hazards.filter(h => h.isWarn || h.level === '高度' || h.level === '不可接受').slice(0, 7);
    const warnCard = el('div', { class: 'card' }, [
      el('div', { class: 'card-h' }, [el('div', { class: 't', html: ui.icon('alert') + ' 风险提示' }), el('span', { class: 'sim-tag', text: '动态预警' })]),
      el('div', { class: 'card-b' }, [warnFeed(warnHz)])
    ]);
    row3.appendChild(warnCard);
    root.appendChild(row3);

    /* ---------- 机场运行日报 ---------- */
    const opsCard = el('div', { class: 'card mt' }, [
      el('div', { class: 'card-h' }, [
        el('div', { class: 't', html: ui.icon('chart') + ' 机场运行情况日报（A-CDM 模拟）' }),
        el('button', { class: 'btn btn-sm', html: ui.icon('download') + ' 导出 Excel', onClick: exportOps })
      ]),
      el('div', { class: 'table-scroll' }, [opsTable(S.all('dailyOps'))])
    ]);
    root.appendChild(opsCard);

    requestAnimationFrame(() => after.forEach(f => f()));
    return root;
  }

  function chartCard(title, id) {
    const body = el('div', { id: id, class: 'chart', style: { height: '262px' } });
    const card = el('div', { class: 'card' }, [
      el('div', { class: 'card-h' }, [el('div', { class: 't', text: title })]),
      el('div', { class: 'card-b' }, [body])
    ]);
    return { card, body };
  }
  function noticeFeed(list) {
    const wrap = el('div', { class: 'list-feed' });
    list.forEach(n => {
      wrap.appendChild(el('div', { class: 'feed-item' }, [
        el('div', { class: 'fi-dot', style: { background: '#2E75B6' } }),
        el('div', { class: 'fi-body' }, [
          el('div', { class: 'fi-t', text: n.title }),
          el('div', { class: 'fi-m' }, [el('span', { text: n.type }), el('span', { text: n.date })])
        ])
      ]));
    });
    return wrap;
  }
  function warnFeed(list) {
    const wrap = el('div', { class: 'list-feed' });
    if (!list.length) return ui.empty('当前无高风险预警');
    list.forEach(h => {
      const item = el('div', { class: 'feed-item' }, [
        el('div', { class: 'fi-dot', style: { background: h.levelTone === 'red' ? '#C0392B' : '#E8833A' } }),
        el('div', { class: 'fi-body' }, [
          el('div', { class: 'fi-t', text: U.truncate(h.desc, 26) }),
          el('div', { class: 'fi-m' }, [
            el('span', {}, [ui.levelBadge(h.level)]),
            el('span', { text: deptName(h.respDeptId) }),
            el('span', { text: '关联 ' + h.triggerCount + ' 次' })
          ])
        ])
      ]);
      item.addEventListener('click', () => SMS.router.go('risk/hazard'));
      wrap.appendChild(item);
    });
    return wrap;
  }
  function opsTable(list) {
    const t = el('table', { class: 'dt' });
    const trh = el('tr', ['日期', '航班架次', '旅客吞吐量', '整改问题数', '已关闭数'].map(x => el('th', { text: x })));
    const thead = el('thead'); thead.appendChild(trh); t.appendChild(thead);
    const tb = el('tbody');
    list.forEach(d => {
      tb.appendChild(el('tr', [d.date, d.flights, U.fmtNum(d.pax), d.issue, d.closed].map(v => el('td', { text: v }))));
    });
    t.appendChild(tb);
    return t;
  }
  function exportOps() {
    U.exportCSV('机场运行日报.csv',
      [{ title: '日期', field: 'date' }, { title: '航班架次', field: 'flights' }, { title: '旅客吞吐量', field: 'pax' }, { title: '整改问题数', field: 'issue' }, { title: '已关闭数', field: 'closed' }],
      S.all('dailyOps'));
    ui.toast('运行日报已导出', 'ok');
  }

  SMS.registerModule({
    id: 'dashboard',
    menus: [
      { group: 'home', name: '公司级首页', icon: 'dashboard', route: 'home/company', order: 1 },
      { group: 'home', name: '部门级首页', icon: 'home', route: 'home/department', order: 2 }
    ],
    routes: [
      { path: 'home/company', name: '公司级首页', group: 'home', render: () => build(true) },
      { path: 'home/department', name: '部门级首页', group: 'home', render: () => build(false) }
    ]
  });
})();


/* ===== modules/workbench.js ===== */
/* =====================================================================
   modules/workbench.js — 个人中心 / 工作台（D1）
   待处理任务（到期标红）、待处理督办、我的培训、已处理任务；
   分类别统计/查询、节点提醒、流程跳转。
   ===================================================================== */
(function () {
  'use strict';
  const SMS = window.SMS, S = SMS.store, U = SMS.util, ui = SMS.ui;
  const el = U.el;
  const deptName = id => { const d = S.get('departments', id); return d ? d.name : '—'; };

  function myTodos(status) {
    const u = SMS.auth.user();
    return S.all('todos').filter(t => t.assigneeId === u.id && t.status === status);
  }

  function build() {
    const root = el('div');
    const u = SMS.auth.user();

    const todo = myTodos('待办');
    const overdue = todo.filter(t => U.dueState(t.dueDate) === 'overdue');
    const myTrain = S.all('trainings').filter(t => (t.users || []).includes(u.id) && t.status !== '已完成');
    const myExam = S.all('examTasks').filter(t => (t.users || []).includes(u.id) && t.status === '待考');

    /* 概览卡 */
    const statRow = el('div', { class: 'grid g4' }, [
      ui.statCard({ icon: 'clock', tone: 'var(--brand)', toneBg: 'var(--brand-soft)', value: todo.length, label: '待处理任务', sub: '待办 ' + todo.length + ' 项' }),
      ui.statCard({ icon: 'alert', tone: 'var(--danger)', toneBg: 'var(--danger-soft)', value: overdue.length, label: '已逾期待办', sub: overdue.length ? '请尽快处理' : '无逾期', dir: overdue.length ? 'up' : 'down' }),
      ui.statCard({ icon: 'book', tone: 'var(--teal)', toneBg: 'var(--teal-soft)', value: myTrain.length, label: '我的培训', sub: '待考 ' + myExam.length + ' 项' }),
      ui.statCard({ icon: 'check', tone: 'var(--accent)', toneBg: 'var(--accent-soft)', value: myTodos('已完成').length, label: '已处理任务', sub: '累计完成' })
    ]);
    root.appendChild(statRow);

    /* 逾期提醒横幅 */
    if (overdue.length) {
      const banner = el('div', {
        class: 'mt', style: { background: 'var(--danger-soft)', border: '1px solid var(--danger)', borderRadius: '8px', padding: '10px 14px', display: 'flex', gap: '10px', alignItems: 'center', color: 'var(--danger)' }
      }, [el('span', { html: ui.icon('alert', 18) }), el('span', { text: '您有 ' + overdue.length + ' 项任务已超过办理期限，系统已自动催办并升级，请优先处理。' })]);
      root.appendChild(banner);
    }

    /* 标签页 */
    const tabs = ui.tabs({
      tabs: [
        { key: 'todo', label: '待处理任务', count: todo.length, render: b => b.appendChild(taskTable(todo, false)) },
        { key: 'sup', label: '待处理督办', count: todo.filter(t => t.type === 'supervision').length, render: b => b.appendChild(taskTable(todo.filter(t => t.type === 'supervision'), false)) },
        { key: 'train', label: '我的培训', count: myTrain.length + myExam.length, render: b => { b.appendChild(trainBlock(myTrain, myExam)); } },
        { key: 'done', label: '已处理任务', count: myTodos('已完成').length, render: b => b.appendChild(taskTable(myTodos('已完成'), true)) }
      ]
    });
    root.appendChild(el('div', { class: 'mt' }, [tabs]));
    return root;
  }

  function taskTable(list, done) {
    const wrap = el('div', { class: 'table-wrap' });
    const scroll = el('div', { class: 'table-scroll' });
    const t = el('table', { class: 'dt' });
    const trh = el('tr', ['任务名称', '类别', '来源', '承办部门', '要求完成', '状态'].map(x => el('th', { text: x })));
    const thead = el('thead'); thead.appendChild(trh); t.appendChild(thead);
    const tb = el('tbody');
    if (!list.length) {
      const tr = el('tr'), td = el('td', { colspan: 6 }); td.appendChild(ui.empty(done ? '暂无已处理记录' : '暂无待办任务')); tr.appendChild(td); tb.appendChild(tr);
    }
    list.forEach(x => {
      const due = U.dueState(x.dueDate);
      const cls = !done && due === 'overdue' ? 'overdue' : '';
      const tr = el('tr', { class: cls, style: { cursor: 'pointer' } });
      tr.appendChild(el('td', { html: '<span class="cell-main">' + U.escapeHtml(x.title) + '</span>' }));
      tr.appendChild(el('td', { text: x.category }));
      tr.appendChild(el('td', { text: x.source }));
      tr.appendChild(el('td', { text: deptName(x.deptId) }));
      tr.appendChild(el('td', {
        html: U.escapeHtml(x.dueDate) + (!done && due === 'overdue' ? ' <span class="badge red">已逾期</span>' : !done && due === 'due' ? ' <span class="badge orange">临期</span>' : '')
      }));
      const st = done ? ui.badge('已完成', 'green') : ui.badge('待办', x.dueDate && due === 'overdue' ? 'red' : 'blue');
      tr.appendChild(el('td', {}, [st]));
      tr.addEventListener('click', () => SMS.router.go(x.route));
      tb.appendChild(tr);
    });
    t.appendChild(tb); scroll.appendChild(t); wrap.appendChild(scroll);
    return wrap;
  }

  function trainBlock(train, exam) {
    const wrap = el('div');
    if (train.length) {
      wrap.appendChild(el('div', { class: 'section-title', text: '待完成培训' }));
      const cw = el('div', { class: 'grid g2' });
      train.forEach(t => {
        cw.appendChild(el('div', { class: 'card' }, [el('div', { class: 'card-b' }, [
          el('div', { class: 'strong', text: t.name }),
          el('div', { class: 'small muted mt', html: '计划 ' + t.planDate + ' · ' + t.way + ' · 学时 ' + t.hours + ' 分钟' }),
          el('div', { class: 'mt' }, [el('span', { class: 'btn btn-sm btn-primary', text: '进入学习', onClick: () => SMS.router.go('promotion/training') })])
        ])]));
      });
      wrap.appendChild(cw);
    }
    if (exam.length) {
      wrap.appendChild(el('div', { class: 'section-title', text: '待办考试' }));
      const ew = el('div', { class: 'grid g2' });
      exam.forEach(t => {
        ew.appendChild(el('div', { class: 'card' }, [el('div', { class: 'card-b' }, [
          el('div', { class: 'strong', text: t.name }),
          el('div', { class: 'small muted mt', html: '考试时间 ' + t.planDate + ' · 时长 ' + t.duration + ' 分钟' }),
          el('div', { class: 'mt' }, [el('span', { class: 'btn btn-sm btn-accent', text: '进入考试', onClick: () => SMS.router.go('promotion/exam') })])
        ])]));
      });
      wrap.appendChild(ew);
    }
    if (!train.length && !exam.length) wrap.appendChild(ui.empty('暂无培训与考试安排'));
    return wrap;
  }

  SMS.registerModule({
    id: 'workbench',
    menus: [{ group: 'workbench', name: '我的工作台', icon: 'home', route: 'workbench/view', order: 1 }],
    routes: [{ path: 'workbench/view', name: '我的工作台', group: 'workbench', render: () => build() }]
  });
})();


/* ===== modules/risk.js ===== */
/* =====================================================================
   modules/risk.js — 安全风险管理（D3）
   危险源管理（全字段 + 动态评价 + AI 智能推荐 I2）、专项风险管理、
   风险评价标准（可配置 / 可切换）、风险矩阵热力图、变更自动触发。
   风险值 = 可能性 L × 严重性 S（默认 5×5，标准可切换）。
   ===================================================================== */
(function () {
  'use strict';
  const SMS = window.SMS, S = SMS.store, U = SMS.util, ui = SMS.ui;
  const el = U.el;

  const deptOpts = () => S.all('departments').map(d => ({ value: d.id, label: d.name }));
  const deptName = id => { const d = S.get('departments', id); return d ? d.name : '—'; };
  const facOpts = () => S.all('facilities').map(f => ({ value: f.id, label: f.name }));
  const postOpts = () => S.all('posts').map(p => ({ value: p.id, label: p.name }));

  /* ============== 评价标准（可切换） ============== */
  // 默认阈值：1-2 可忽略 / 3-4 低度 / 5-9 中度 / 10-15 高度 / 16-25 不可接受
  const DEFAULT_STD = { id: 'std-default', name: '机场通用风险评价标准（L×S 五级）', method: '风险值=可能性×严重性', ignoreMax: 2, lowMax: 4, midMax: 9, highMax: 15, isCurrent: 1, note: '依据《民用机场安全管理体系建设指南》风险评价矩阵，结合机场运行实际设定。' };

  function standards() { let list = S.all('riskStandards'); if (!list.length) { S.insert('riskStandards', U.clone(DEFAULT_STD)); list = S.all('riskStandards'); } return list; }
  function currentStd() { const c = standards().find(x => x.isCurrent === 1) || standards()[0]; return c; }
  function levelOf(v) {
    const s = currentStd();
    if (v <= s.ignoreMax) return '可忽略';
    if (v <= s.lowMax) return '低度';
    if (v <= s.midMax) return '中度';
    if (v <= s.highMax) return '高度';
    return '不可接受';
  }
  const ACCEPT_OF = { '可忽略': '可接受', '低度': '可接受', '中度': '缓解后可接受', '高度': '不可接受', '不可接受': '不可接受' };

  SMS.riskLevel = { levelOf, currentStd, standards, ACCEPT_OF };

  /* ============== AI 智能风险评价（I2，规则可解释） ============== */
  // 关键词规则：类别 → 严重性基准、措施
  const RULES = [
    { keys: ['跑道侵入', '跑道', '道面', 'FOD', '外来物', '摩擦系数'], cat: '飞行区/道面', S: 4, measures: '加强跑道徒步与车巡频次；FOD 随手拍与即时清理；道面破损限时修补并复检摩擦系数；关键时段运行管制员双岗复核。' },
    { keys: ['鸟击', '鸟类', '鸟情', '鸟巢'], cat: '鸟害', S: 3, measures: '生态环境治理（除草、清淤、灭虫）；声光煤气炮组合驱鸟并轮换；鸟情高发时段加密巡视；鸟击标本留存与种群分析。' },
    { keys: ['雷击', '雷雨', '闪电', '强对流'], cat: '气象灾害', S: 4, measures: '雷雨季节前完成防雷检测；接收气象预警提前停场固定设备；户外作业撤离与设备接地；事后专项排查。' },
    { keys: ['除冰', '低温', '冰雪', '冻', '霜'], cat: '冬季运行', S: 3, measures: '除防冰液储备与设备检定；除冰液配比与保持时间记录；低温道面除冰雪预案；人员防滑与车辆限速。' },
    { keys: ['机坪', '车辆', '碰撞', '碾压', '车速', '驾驶员'], cat: '机坪运行', S: 3, measures: '机坪车辆限速与路线管理；驾驶员资质年审与实操考核；重点区域设减速与警示；违章记分与停岗培训。' },
    { keys: ['加油', '油料', '航油', '溢油', '静电'], cat: '供油', S: 4, measures: '加油设备静电接地与防溢漏检查；加油作业禁区管控；溢油应急处置演练；油料人员持证上岗。' },
    { keys: ['净空', '无人机', '升空', '超高', '塔吊'], cat: '净空保护', S: 4, measures: '净空保护区巡查与超高障碍物管控；无人机联防联控与举报；施工塔吊限高与警示灯；地方协同执法。' },
    { keys: ['行李', '装卸', '货舱', '传送带', '卡货'], cat: '地面保障', S: 2, measures: '装卸作业规范与舱门监护；传送带定期检修；货物系固与重量配平；人员防夹伤培训。' },
    { keys: ['安检', '违禁品', '图像识别', '漏检'], cat: '安检', S: 4, measures: '安检图像识别训练与月度考核；开机员双人复核；违禁品处置流程；设备校准与应急通道管理。' },
    { keys: ['消防', '火情', '火灾', '起火', '疏散'], cat: '消防', S: 5, measures: '消防设施器材月检与维保；重点防火部位巡查；消防演练与疏散；用电用气安全检查。' },
    { keys: ['信息系统', '网络', '数据', '系统故障', '宕机'], cat: '信息系统', S: 3, measures: '关键系统双机热备与数据备份；网络安全等保防护；故障应急预案与演练；权限最小化与日志审计。' }
  ];

  function similarity(a, b) { // 简易 Jaccard（2-gram）
    const ga = new Set(), gb = new Set();
    for (let i = 0; i < a.length - 1; i++) ga.add(a.slice(i, i + 2));
    for (let i = 0; i < b.length - 1; i++) gb.add(b.slice(i, i + 2));
    let inter = 0; ga.forEach(x => { if (gb.has(x)) inter++; });
    return inter / (ga.size + gb.size - inter || 1);
  }

  function aiRecommend(text) {
    text = text || '';
    let rule = null, hit = [];
    for (const r of RULES) {
      const h = r.keys.filter(k => text.indexOf(k) >= 0);
      if (h.length > hit.length) { rule = r; hit = h; }
    }
    // 历史相似案例
    const hist = S.all('hazards').map(h => ({ h, sim: similarity(text, h.name + h.scene + h.desc) })).filter(x => x.sim > 0.18).sort((a, b) => b.sim - a.sim).slice(0, 3);
    let L = 2, S2 = rule ? rule.S : 2;
    if (hist.length) {
      L = Math.round(U.sum(hist, x => x.h.likelihood) / hist.length);
      S2 = Math.max(S2, Math.round(U.sum(hist, x => x.h.severity) / hist.length));
    }
    // 季节/天气修正可能性
    const m = Number(U.today().slice(5, 7));
    if (rule && ((rule.cat === '气象灾害' && (m >= 4 && m <= 8)) || (rule.cat === '冬季运行' && (m === 12 || m <= 2)) || (rule.cat === '鸟害' && (m >= 3 && m <= 5 || m >= 9 && m <= 11)))) L = Math.min(5, L + 1);
    if (text.indexOf('反复') >= 0 || text.indexOf('多次') >= 0 || text.indexOf('频繁') >= 0) L = Math.min(5, L + 1);
    L = U.clamp(L, 1, 5); S2 = U.clamp(S2, 1, 5);
    const v = L * S2, level = levelOf(v);
    const reasons = [];
    if (rule) reasons.push('匹配“' + rule.cat + '”关键词（' + hit.join('、') + '），严重性基准取 ' + S2);
    if (hist.length) reasons.push('检索到 ' + hist.length + ' 个相似历史案例，可能性参考其均值');
    reasons.push('结合当前季节/频次修正后 L=' + L + '、S=' + S2);
    return {
      likelihood: L, severity: S2, riskValue: v, level, acceptability: ACCEPT_OF[level],
      measures: rule ? rule.measures : '建议组织专项辨识，明确责任岗位，从工程控制、管理控制、培训与个体防护等方面制定措施并跟踪验证。',
      reason: reasons.join('；') + '。结果为算法推荐，须由安全管理人员人工确认。',
      cases: hist.map(x => x.h.id)
    };
  }
  SMS.aiRisk = { recommend: aiRecommend, similarity };

  /* ============== 危险源管理 ============== */
  const CATS = ['飞行区运行', '机坪运行', '净空保护', '气象灾害', '鸟害防治', '供油保障', '地面保障', '安检保卫', '消防应急', '信息系统', '冬季运行'];
  const SYSTEMS = ['安全政策', '风险管理', '安全保证', '安全促进'];
  const HD_STATUS = ['待评价', '已评价', '管控中', '已消除'];
  const SOURCES = ['日常辨识', '专项辨识', '事件调查', '隐患转化', '变更触发', '外部反馈'];

    { field: 'scene', label: '危险源场景描述', type: 'textarea', span: 2, placeholder: '描述危险源产生的场景、触发条件' },
    { field: 'desc', label: '可能导致的后果', type: 'textarea', span: 2 },
    { field: 'respDeptId', label: '责任部门', type: 'select', options: deptOpts, required: true },
    { field: 'respPostId', label: '责任岗位', type: 'select', options: postOpts },
    { field: 'likelihood', label: '可能性 L(1-5)', type: 'number', required: true, min: 1, max: 5 },
    { field: 'severity', label: '严重性 S(1-5)', type: 'number', required: true, min: 1, max: 5 },
    { field: 'ai', label: '智能评价', type: 'button', span: 2, icon: 'sparkle', text: 'AI 根据描述与历史案例推荐等级和管控措施（人工确认）', cls: 'btn btn-teal',
      onClick: api => {

        api.set('controlMeasures', rec.measures); api.set('expertEval', rec.reason);
        ui.toast('已生成推荐：' + rec.level + '（' + rec.riskValue + '），请人工确认', 'ok');
      } },

    { field: 'level', label: '风险等级', type: 'readonly' },

    { field: 'controlMeasures', label: '管控措施', type: 'textarea', span: 2 },
    { field: 'residualL', label: '剩余 L', type: 'number', min: 1, max: 5 },
    { field: 'residualS', label: '剩余 S', type: 'number', min: 1, max: 5 },
    { field: 'residualValue', label: '剩余风险值', type: 'readonly' },
    { field: 'residualLevel', label: '剩余等级', type: 'readonly' },
    { field: 'status', label: '状态', type: 'select', options: HD_STATUS, default: '待评价' },
    { field: 'foundDate', label: '识别日期', type: 'date' },
    { field: 'source', label: '来源', type: 'select', options: SOURCES },
    { field: 'isWarn', label: '纳入动态预警', type: 'switch', default: false },
    { field: 'warnValue', label: '预警阈值(关联次数)', type: 'number', min: 0, default: 3 },
    { field: 'triggerCount', label: '已关联触发次数', type: 'number', min: 0, default: 0 },
    { field: 'remark', label: '备注', type: 'textarea', span: 2 }
  ];

  function hazardPage() {

            { label: '动态预警', value: r.isWarn ? '是，阈值 ' + r.warnValue + '，已关联 ' + r.triggerCount + ' 次' : '否' }

        }

  /* ============== 专项风险管理 ============== */
  const SP_TYPES = ['专项辨识', '变更触发', '季节专项', '重大活动保障'];

  }

  function createSpecialFromHazard(h) {
    const rec = {
      name: h.name + '专项风险管控', type: '专项辨识', respDeptId: h.respDeptId, startDate: U.today(),
      status: '进行中', relatedProject: '由危险源 ' + h.code + ' 转入', hazardIds: h.code,

  /* ============== 风险评价标准 ============== */
  function criteriaPage() {
    const root = el('div');
    root.appendChild(el('div', { class: 'page-head' }, [
      el('div', null, [el('h2', { html: ui.icon('gear', 19) + ' 风险评价标准' }), el('div', { class: 'desc', text: '支持多套评价标准的新增、编辑与切换；切换后危险源等级按当前标准重新判定。' })])

      el('div', { class: 'card-h' }, [el('div', { class: 't', id: 'std-title', text: currentStd().name })]),
      el('div', { class: 'card-b' }, [matrixEl()])

      el('div', { class: 'card-b' }, [stdList(matrixCard)])
    ]);
    grid.appendChild(listCard);
    root.appendChild(grid);
    return root;
  }
  function matrixEl() {
    const wrap = el('div');
    const tbl = el('table', { class: 'risk-matrix' });
    // 表头：严重性
    let tr = el('tr');
    tr.appendChild(el('th', { text: 'L↓ / S→' }));
    for (let s = 1; s <= 5; s++) tr.appendChild(el('th', { text: 'S=' + s }));
    const thead = el('thead'); thead.appendChild(tr); tbl.appendChild(thead);
    const tb = el('tbody');
    for (let l = 5; l >= 1; l--) {
      const r = el('tr');
      r.appendChild(el('th', { text: 'L=' + l }));
      for (let s = 1; s <= 5; s++) {
        const v = l * s, lv = levelOf(v);
        const td = el('td', { class: 'rm-cell', style: { background: ui.LEVEL_COLORS[lv] }, html: '<b>' + v + '</b><span>' + lv + '</span>' });
        td.title = lv + ' · ' + ACCEPT_OF[lv];
        r.appendChild(td);
      }
      tb.appendChild(r);
    }
    tbl.appendChild(tb); wrap.appendChild(tbl);
    wrap.appendChild(el('div', { class: 'small muted mt', text: '可接受性：可忽略/低度=可接受；中度=缓解后可接受；高度/不可接受=不可接受。' }));
    return wrap;
  }
  function stdList(matrixCard) {
    const wrap = el('div', { class: 'std-list' });
    standards().forEach(s => {
      const item = el('div', { class: 'std-item' + (s.isCurrent ? ' cur' : '') }, [
        el('div', { class: 'std-n', text: s.name + (s.isCurrent ? '（当前）' : '') }),
        el('div', { class: 'small muted', text: s.method + '；阈值 ' + s.ignoreMax + '/' + s.lowMax + '/' + s.midMax + '/' + s.highMax }),
        el('div', { class: 'std-ops' }, [
          s.isCurrent ? null : el('span', { class: 'act-link', text: '切换', onClick: () => switchStd(s, matrixCard) }),
          el('span', { class: 'act-link', text: '编辑', onClick: () => editStd(s, matrixCard) })
        ])
      ]);
      wrap.appendChild(item);
    });
    return wrap;
  }
  function refreshMatrix(matrixCard) {
    const body = matrixCard.querySelector('.card-b');
    U.clear(body); body.appendChild(matrixEl());
    matrixCard.querySelector('#std-title').textContent = currentStd().name;
  }
  function switchStd(s, matrixCard) {
    standards().forEach(x => S.update('riskStandards', x.id, { isCurrent: x.id === s.id ? 1 : 0 }));
    // 重算全部危险源等级
    S.all('hazards').forEach(h => {
      const v = (Number(h.likelihood) || 0) * (Number(h.severity) || 0);
      const lv = v ? levelOf(v) : h.level;
      S.update('hazards', h.id, { level: lv, acceptability: lv ? ACCEPT_OF[lv] : h.acceptability });
    });
    refreshMatrix(matrixCard);
    ui.toast('已切换标准并重算危险源等级', 'ok');
  }
  function stdForm(s) {

  function addStd() {

      ui.toast('已保存', 'ok');
    } });
  }

  /* ============== 风险矩阵热力图（含危险源计数） ============== */
  function matrixHeatPage() {
    const root = el('div');
    root.appendChild(el('div', { class: 'page-head' }, [el('div', null, [el('h2', { html: ui.icon('chart', 19) + ' 风险矩阵分布' }), el('div', { class: 'desc', text: '按可能性×严重性统计危险源在各单元格的数量，识别重大、高频危险源。' })])]));
    const card = el('div', { class: 'card mt' }, [el('div', { class: 'card-b' }, [heatEl()])]);
    root.appendChild(card);
    return root;
  }
  function heatEl() {
    const wrap = el('div');
    const chart = el('div', { style: { height: '420px' } });
    wrap.appendChild(chart);
    requestAnimationFrame(() => {
      const data = [];
      for (let l = 1; l <= 5; l++) for (let s = 1; s <= 5; s++) {
        const cnt = S.all('hazards').filter(h => Number(h.likelihood) === l && Number(h.severity) === s).length;
        data.push([s - 1, l - 1, cnt]);
      }
      const pieces = [
        { gte: 16, color: '#C0392B' }, { gte: 10, lte: 15, color: '#E8833A' },
        { gte: 5, lte: 9, color: '#E0A024' }, { gte: 3, lte: 4, color: '#9CC3A0' }, { lte: 2, color: '#7FB069' }
      ];
      ui.chart(chart, ui.baseOption({
        tooltip: { formatter: p => 'L=' + (p.value[1] + 1) + ' S=' + (p.value[0] + 1) + '<br/>危险源 ' + p.value[2] + ' 项' },
        grid: { left: 60, right: 30, top: 30, bottom: 50 },
        xAxis: { type: 'category', data: ['S=1', 'S=2', 'S=3', 'S=4', 'S=5'], name: '严重性', nameLocation: 'middle', nameGap: 28 },
        yAxis: { type: 'category', data: ['L=1', 'L=2', 'L=3', 'L=4', 'L=5'], name: '可能性', nameLocation: 'middle', nameGap: 38 },
        visualMap: { show: false, type: 'piecewise', dimension: 2, pieces: [{ gt: 0, color: '#1F4E79' }] },
        series: [{
          type: 'heatmap', data, label: { show: true, formatter: p => p.value[2] || '' },
          itemStyle: { borderColor: '#fff', borderWidth: 2 },
          emphasis: { itemStyle: { shadowBlur: 8, shadowColor: 'rgba(0,0,0,.3)' } }
        }]
      }));
    });
    // 高频/重大危险源清单
    const top = S.all('hazards').filter(h => h.level === '高度' || h.level === '不可接受' || h.triggerCount >= 3);
    wrap.appendChild(el('div', { class: 'section-title', text: '重大 / 高频危险源' }));
    const t = el('table', { class: 'dt' });
    const thead = el('thead'); thead.appendChild(el('tr', ['编号', '危险源', '等级', '关联次数', '责任部门'].map(x => el('th', { text: x })))); t.appendChild(thead);
    const tb = el('tbody');
    top.forEach(h => tb.appendChild(el('tr', [
      el('td', { text: h.code }), el('td', { text: h.name }),
      el('td', {}, [ui.levelBadge(h.level)]), el('td', { text: h.triggerCount }), el('td', { text: deptName(h.respDeptId) })
    ])));
    t.appendChild(tb); wrap.appendChild(t);
    return wrap;
  }

  /* ============== 注册 ============== */
  SMS.registerModule({
    id: 'risk',
    menus: [
      { group: 'risk', name: '危险源管理', icon: 'shield', route: 'risk/hazard', order: 1 },
      { group: 'risk', name: '专项风险管理', icon: 'flag', route: 'risk/special', order: 2 },
      { group: 'risk', name: '风险评价标准', icon: 'gear', route: 'risk/criteria', order: 3 },
      { group: 'risk', name: '风险矩阵', icon: 'chart', route: 'risk/matrix', order: 4 }
    ],
    routes: [
      { path: 'risk/hazard', name: '危险源管理', group: 'risk', render: hazardPage },
      { path: 'risk/special', name: '专项风险管理', group: 'risk', render: specialPage },
      { path: 'risk/criteria', name: '风险评价标准', group: 'risk', render: criteriaPage },
      { path: 'risk/matrix', name: '风险矩阵', group: 'risk', render: matrixHeatPage }
    ]
  });
})();


/* ===== modules/hiddendanger.js ===== */
/* =====================================================================
   modules/hiddendanger.js — 隐患排查整改闭环（D3.7 / D5.2）
   状态机：待整改 → 整改中 → 待复查 → 已关闭；复查不通过退回整改。
   整改（整改措施/等效替代）、复查验证、证据留存、超期自动催办升级（I8）、
   关闭时文本相似度去重并自动转入危险源库（I3）。
   ===================================================================== */
(function () {
  'use strict';
  const SMS = window.SMS, S = SMS.store, U = SMS.util, ui = SMS.ui;
  const el = U.el;
  const deptOpts = () => S.all('departments').map(d => ({ value: d.id, label: d.name }));
  const deptName = id => (S.get('departments', id) || {}).name || '—';
  const userOpts = () => S.all('users').map(u => ({ value: u.id, label: u.name }));
  const userName = id => (S.get('users', id) || {}).name || '—';
  const facOpts = () => S.all('facilities').map(f => ({ value: f.id, label: f.name }));

  const HD_LEVELS = ['一般隐患', '重大隐患'];
  const HD_SOURCES = ['日常检查', '专项检查', '内部审核', '自愿报告', '强制报告', '事件调查', '外部反馈'];
  const STATUS = ['待整改', '整改中', '待复查', '已关闭', '已退回'];

  /* ---------- 超期自动催办升级（每日一次，I8） ---------- */
  function runEscalation() {
    if (S.jobRanToday('hd-escalate')) return;
    let changed = false;
    S.all('hiddenDangers').forEach(h => {
      if (h.status !== '已关闭' && h.rectifyDue && h.rectifyDue < U.today() && !h.escalated) {
        S.update('hiddenDangers', h.id, { escalated: 1 });
        // 升级至承办部门负责人
        const leader = S.find('users', u => u.deptId === h.rectifyDeptId && (u.role === '部门领导'));
        S.insert('todos', { title: '【超期升级】隐患 ' + h.code + ' 已超期未闭环，请督办', category: '隐患整改', type: 'hazard', assigneeId: leader ? leader.id : h.rectifierId, deptId: h.rectifyDeptId, dueDate: U.today(), route: 'risk/hiddendanger', status: '待办', source: '系统升级' });
        changed = true;
      }
    });
    S.markJob('hd-escalate');
    if (changed) ui.toast('检测到超期隐患，系统已自动催办并升级', 'warn');
  }

  /* ---------- 关闭时自动转危险源（相似度去重，I3） ---------- */
  function transferToHazard(h) {
    const text = h.desc + (h.category || '');
    let best = { sim: 0, hz: null };
    S.all('hazards').forEach(hz => {
      const sim = SMS.aiRisk.similarity(text, hz.name + hz.scene + hz.desc);
      if (sim > best.sim) best = { sim, hz };
    });
    if (best.sim >= 0.5) {
      S.update('hiddenDangers', h.id, { toHazard: '是（关联）', hazardId: best.hz.id });
      S.inc('hazards', best.hz.id, 'triggerCount', 1);
      return '已匹配到相似危险源 ' + best.hz.code + '（相似度 ' + Math.round(best.sim * 100) + '%），自动关联、不重复建档。';
    }
    const n = S.all('hazards').filter(x => (x.code || '').indexOf('WXY-' + U.today().slice(0, 4)) === 0).length + 1;
    const hz = S.insert('hazards', {
      code: 'WXY-' + U.today().slice(0, 4) + '-' + String(n).padStart(3, '0'),
      name: U.truncate(h.desc, 24), category: h.category || '机坪运行', system: '风险管理',
      facilityId: h.facilityId, scene: '由隐患 ' + h.code + ' 关闭时自动转入。', desc: h.desc,
      respDeptId: h.rectifyDeptId, respPostId: '', likelihood: 3, severity: h.level === '重大隐患' ? 4 : 2,
      riskValue: '', level: '', acceptability: '', expertEval: '', controlMeasures: h.rectifyDesc || '',
      status: '待评价', foundDate: U.today(), source: '隐患转化', isWarn: h.level === '重大隐患',
      warnValue: 3, triggerCount: 1, remark: '隐患关闭自动转入，待动态评价。'
    });
    S.update('hiddenDangers', h.id, { toHazard: '是（新建）', hazardId: hz.id });
    return '未发现相似危险源，已自动新建危险源 ' + hz.code + ' 并转入危险源库，待动态评价。';
  }

  /* ---------- 表单字段 ---------- */
  const fields = [
    { field: 'code', label: '隐患编号', type: 'readonly' },
    { field: 'source', label: '问题来源', type: 'select', options: HD_SOURCES, required: true },
    { field: 'level', label: '隐患级别', type: 'radio', options: HD_LEVELS, required: true, default: '一般隐患' },
    { field: 'category', label: '安全类别', type: 'select', options: ['飞行区运行', '机坪运行', '净空保护', '气象灾害', '鸟害防治', '供油保障', '地面保障', '安检保卫', '消防应急', '信息系统'] },
    { field: 'facilityId', label: '所在部位/设施', type: 'select', options: facOpts },
    { field: 'desc', label: '问题描述', type: 'textarea', span: 2, required: true },
    { field: 'foundDate', label: '发现日期', type: 'date', required: true },
    { field: 'foundById', label: '发现人', type: 'select', options: userOpts },
    { field: 'rectifyDeptId', label: '整改责任部门', type: 'select', options: deptOpts, required: true },
    { field: 'rectifierId', label: '整改责任人', type: 'select', options: userOpts, required: true },
    { field: 'rectifyDue', label: '整改期限', type: 'date', required: true },
    { field: 'status', label: '状态', type: 'select', options: STATUS, default: '待整改' },
    { field: 'remark', label: '备注', type: 'textarea', span: 2 }
  ];

  function page() {
    runEscalation();
    return ui.crudPage({
      title: '隐患排查整改', icon: 'alert', table: 'hiddenDangers', tableTitle: '隐患台账',
      subtitle: '隐患登记、整改（整改措施/等效替代）、复查验证与关闭的全流程闭环，证据材料留存；关闭自动转入危险源库。',
      columns: [
        { field: 'code', title: '编号', width: '120px' },
        { field: 'desc', title: '问题描述', render: (v, r) => '<span class="cell-main">' + U.escapeHtml(U.truncate(v, 30)) + '</span>' + (r.escalated ? ' <span class="badge red">超期升级</span>' : '') },
        { field: 'level', title: '级别', width: '92px', render: v => ui.badge(v, v === '重大隐患' ? 'red' : 'yellow').outerHTML },
        { field: 'rectifyDeptId', title: '责任部门', width: '120px', render: v => deptName(v) },
        { field: 'rectifierId', title: '责任人', width: '90px', render: v => userName(v) },
        { field: 'rectifyDue', title: '整改期限', width: '104px' },
        { field: 'status', title: '状态', width: '90px', badge: v => ({ '已关闭': 'green', '待复查': 'orange', '待整改': 'red', '整改中': 'blue', '已退回': 'red' })[v] },
        { field: 'toHazard', title: '转危险源', width: '100px', render: v => v ? ui.badge(v, 'teal').outerHTML : '—' }
      ],
      filters: [
        { field: 'level', label: '级别', type: 'select', options: HD_LEVELS },
        { field: 'status', label: '状态', type: 'select', options: STATUS },
        { field: 'rectifyDeptId', label: '责任部门', type: 'select', options: deptOpts }
      ],
      fields, formSize: 'lg', addText: '登记隐患',
      onBeforeSave(rec, mode) {
        if (mode === 'add' && !rec.code) rec.code = 'YH-' + U.today().slice(0, 4) + '-' + String(S.all('hiddenDangers').length + 1).padStart(3, '0');
        if (!rec.foundDate) rec.foundDate = U.today();
        if (!rec.flowLog) rec.flowLog = [{ time: U.nowStr(), by: userName((SMS.auth.user() || {}).id), action: '登记隐患', note: rec.desc }];
      },
      actions: [
        { label: '提交整改', show: r => ['待整改', '整改中', '已退回'].includes(r.status), onClick: r => rectifyModal(r) },
        { label: '复查验证', show: r => r.status === '待复查', tone: '', onClick: r => verifyModal(r) }
      ],
      rowClass(r) { return r.status !== '已关闭' && r.rectifyDue && r.rectifyDue < U.today() ? 'danger-row' : ''; },
      detail: {
        title: r => '隐患 ' + r.code, size: 'xl',
        render(r) { return detail(r); }
      }
    });
  }

  /* ---------- 整改弹窗 ---------- */
  function rectifyModal(h) {
    const f = ui.renderForm([
      { field: 'rectifyType', label: '整改方式', type: 'radio', options: ['整改措施', '等效替代'], required: true, default: '整改措施' },
      { field: 'rectifyDesc', label: '整改情况说明', type: 'textarea', span: 2, required: true, placeholder: '说明采取的工程/管理措施、整改过程与结果' },
      { field: 'rectifyFund', label: '整改资金(元)', type: 'number', min: 0 },
      { field: 'rectifyAttach', label: '整改后照片/佐证材料', type: 'file', span: 2 },
      { field: 'rectifyDate', label: '整改完成日期', type: 'date', default: U.today() }
    ], h);
    ui.modal({
      title: '提交整改 · ' + h.code, icon: 'clipboard', size: 'lg', body: f.el, okText: '提交复查',
      onOk: (b, close) => {
        if (!f.validate()) return;
        const rec = f.rec();
        rec.status = '待复查'; rec.escalated = 0;
        rec.flowLog = (h.flowLog || []).concat([{ time: U.nowStr(), by: SMS.auth.user().name, action: '提交整改（' + rec.rectifyType + '）', note: rec.rectifyDesc }]);
        S.update('hiddenDangers', h.id, rec);
        // 通知复查人（部门安全员 / 监察员）
        const verifier = S.find('users', u => u.deptId === h.rectifyDeptId && u.role === '部门安全员') || S.get('users', 'user-ds');
        S.insert('todos', { title: '隐患 ' + h.code + ' 已提交整改，请复查验证', category: '隐患整改', type: 'hazard', assigneeId: verifier ? verifier.id : 'user-ds', deptId: h.rectifyDeptId, dueDate: U.fmtDate(U.addDays(new Date(), 5)), route: 'risk/hiddendanger', status: '待办', source: '隐患复查' });
        close(); ui.toast('整改已提交，等待复查验证', 'ok');
      }
    });
  }

  /* ---------- 复查弹窗 ---------- */
  function verifyModal(h) {
    const f = ui.renderForm([
      { field: 'verifyResult', label: '验证结果', type: 'radio', options: ['通过（关闭）', '不通过（退回整改）'], required: true, default: '通过（关闭）' },
      { field: 'verifyDesc', label: '验证意见', type: 'textarea', span: 2, required: true },
      { field: 'verifyAttach', label: '验证材料', type: 'file', span: 2 }
    ], h);
    ui.modal({
      title: '复查验证 · ' + h.code, icon: 'check', size: 'lg', body: f.el, okText: '提交验证',
      onOk: (b, close) => {
        if (!f.validate()) return;
        const rec = f.rec();
        const pass = rec.verifyResult.indexOf('通过') === 0;
        rec.verifierId = SMS.auth.user().id; rec.verifyDate = U.today();
        let msg;
        if (pass) {
          rec.status = '已关闭';
          rec.flowLog = (h.flowLog || []).concat([{ time: U.nowStr(), by: SMS.auth.user().name, action: '复查通过，关闭隐患', note: rec.verifyDesc }]);
          S.update('hiddenDangers', h.id, rec);
          msg = transferToHazard(S.get('hiddenDangers', h.id));
        } else {
          rec.status = '已退回';
          rec.flowLog = (h.flowLog || []).concat([{ time: U.nowStr(), by: SMS.auth.user().name, action: '复查不通过，退回整改', note: rec.verifyDesc }]);
          S.update('hiddenDangers', h.id, rec);
          S.insert('todos', { title: '隐患 ' + h.code + ' 复查未通过，请重新整改', category: '隐患整改', type: 'hazard', assigneeId: h.rectifierId, deptId: h.rectifyDeptId, dueDate: U.fmtDate(U.addDays(new Date(), 7)), route: 'risk/hiddendanger', status: '待办', source: '隐患整改' });
        }
        close(); ui.toast(pass ? '隐患已关闭。' + msg : '已退回整改', pass ? 'ok' : 'warn');
      }
    });
  }

  /* ---------- 详情 ---------- */
  function detail(r) {
    const wrap = el('div');
    const stepIndex = { '待整改': 0, '整改中': 1, '已退回': 1, '待复查': 2, '已关闭': 3 }[r.status] || 0;
    wrap.appendChild(ui.approvalSteps([
      { title: '登记建账', meta: r.foundDate },
      { title: '落实整改', meta: r.rectifyType || '待整改' },
      { title: '复查验证', meta: r.verifyDate || '待复查' },
      { title: '关闭/转危险源', meta: r.toHazard || '—' }
    ], stepIndex));

    wrap.appendChild(el('div', { class: 'section-title', text: '基本信息' }));
    wrap.appendChild(ui.descList([
      { label: '问题来源', value: r.source }, { label: '隐患级别', valueDom: ui.badge(r.level, r.level === '重大隐患' ? 'red' : 'yellow') },
      { label: '安全类别', value: r.category }, { label: '所在部位', value: (S.get('facilities', r.facilityId) || {}).name },
      { label: '问题描述', value: r.desc, full: true }, { label: '发现日期', value: r.foundDate }, { label: '发现人', value: userName(r.foundById) },
      { label: '整改责任部门', value: deptName(r.rectifyDeptId) }, { label: '整改责任人', value: userName(r.rectifierId) },
      { label: '整改期限', value: r.rectifyDue }
    ]));

    if (r.rectifyDesc) {
      wrap.appendChild(el('div', { class: 'section-title', text: '整改与验证' }));
      wrap.appendChild(ui.descList([
        { label: '整改方式', value: r.rectifyType }, { label: '整改完成日期', value: r.rectifyDate },
        { label: '整改资金', value: r.rectifyFund ? '¥' + U.fmtNum(r.rectifyFund) : '—' }, { label: '验证人', value: userName(r.verifierId) },
        { label: '整改情况', value: r.rectifyDesc, full: true }, { label: '验证意见', value: r.verifyDesc, full: true },
        { label: '佐证材料', value: r.rectifyAttach || r.verifyAttach || '见附件归档', full: true },
        { label: '危险源转化', value: r.toHazard ? r.toHazard + (r.hazardId ? '（' + (S.get('hazards', r.hazardId) || {}).code + '）' : '') : '关闭后自动处理', full: true }
      ]));
    }

    if (r.flowLog && r.flowLog.length) {
      wrap.appendChild(el('div', { class: 'section-title', text: '办理轨迹' }));
      wrap.appendChild(ui.timeline(r.flowLog.map((x, i) => ({
        title: x.action, meta: U.escapeHtml(x.by) + ' · ' + x.time + (x.note ? '<br/>' + U.escapeHtml(U.truncate(x.note, 60)) : ''),
        state: i === r.flowLog.length - 1 ? 'current' : 'done'
      }))));
    }
    return wrap;
  }

  SMS.registerModule({
    id: 'hiddendanger',
    menus: [{ group: 'risk', name: '隐患排查整改', icon: 'alert', route: 'risk/hiddendanger', order: 5 }],
    routes: [{ path: 'risk/hiddendanger', name: '隐患排查整改', group: 'risk', render: page }]
  });
})();


/* ===== core/bootstrap.js ===== */
/* =====================================================================
   core/bootstrap.js — 应用启动与外壳
   登录（统一登录模拟 + 应急登录）→ 主框架（侧栏 / 顶栏 / 内容区）
   本文件由 loader 最后加载，负责初始化数据并启动。
   ===================================================================== */
(function () {
  'use strict';
  const SMS = window.SMS, S = SMS.store, U = SMS.util, ui = SMS.ui;
  const el = U.el;
  const mount = U.qs('#app');

  function start() {
    S.init();
    if (SMS.auth.isAuthed()) renderShell();
    else renderLogin();
  }

  /* ===================== 登录页 ===================== */
  function renderLogin() {
    U.clear(mount);
    mount.className = 'login-mount';

    const demoAccounts = S.all('users').filter(u => ['admin', 'leader', 'vgm', 'aq', 'inspector', 'inspector2', 'aqadmin', 'dmgr', 'dsafety', 'dsafety2', 'staff'].includes(u.account));

    const ssoSelect = el('select');
    demoAccounts.forEach(u => ssoSelect.appendChild(el('option', { value: u.account, text: u.name + '（' + u.role + '）' })));

    const acc = el('input', { placeholder: '请输入账号', value: 'admin' });
    const pwd = el('input', { type: 'password', placeholder: '请输入密码', value: 'admin123' });

    const errBox = el('div', { class: 'login-err' });

    function doEmergency() {
      errBox.textContent = '';
      const r = SMS.auth.login(acc.value.trim(), pwd.value);
      if (!r.ok) { errBox.textContent = r.msg; return; }
      enterApp();
    }
    function doSSO() {
      const r = SMS.auth.ssoLogin(ssoSelect.value);
      if (!r.ok) { errBox.textContent = r.msg; return; }
      enterApp();
    }

    const card = el('div', { class: 'login-card' }, [
      el('div', { class: 'login-brand' }, [
        el('div', { class: 'lb-logo', html: ui.icon('shield', 26) }),
        el('div', {}, [
          el('div', { class: 'lb-title', text: 'SMS 机场安全管理系统' }),
          el('div', { class: 'lb-sub', text: 'Safety Management System' })
        ])
      ]),

      /* 统一登录 */
      el('div', { class: 'login-block' }, [
        el('label', { class: 'login-label', text: '统一身份认证（OA 单点登录 · 模拟）' }),
        el('div', { class: 'sso-row' }, [ssoSelect, el('button', { class: 'btn btn-primary', html: ui.icon('shield') + ' 统一登录', onClick: doSSO })])
      ]),

      el('div', { class: 'login-divider' }, [el('span', { text: '或使用应急登录' })]),

      /* 应急登录 */
      el('div', { class: 'login-block' }, [
        el('label', { class: 'login-label', text: '应急登录（本系统账号）' }),
        acc, pwd, errBox,
        el('button', { class: 'btn btn-block', html: ui.icon('user') + ' 登 录', onClick: doEmergency })
      ]),

      el('div', { class: 'login-hint' }, [
        el('div', { class: 'strong', style: { marginBottom: '4px' }, text: '演示账号（账号 / 密码）' }),
        el('div', { class: 'small', text: '系统管理员 admin/admin123；总经理 leader/leader123；安全总监 aq/aq123；监察员 inspector/insp123；部门安全员 dsafety/ds123；员工 staff/staff123。' })
      ]),
      el('div', { class: 'login-foot small', text: '北京四型航港科技有限公司 · 系统数据为演示数据' })
    ]);

    pwd.addEventListener('keydown', e => { if (e.key === 'Enter') doEmergency(); });
    mount.appendChild(card);
  }

  function enterApp() {
    if (!location.hash) location.hash = '#/home/company';
    renderShell();
  }

  /* ===================== 主框架 ===================== */
  function renderShell() {
    U.clear(mount);
    mount.className = 'app-mount';

    const sideNav = el('div', { class: 'side-nav' });
    const crumb = el('div', { class: 'crumb' });
    const content = el('div', { class: 'content' });

    /* 顶栏右侧 */
    const u = SMS.auth.user();
    const roleSwitch = el('select', { class: 'role-switch', title: '演示用：切换角色' });
    S.all('users').filter(x => ['admin', 'leader', 'vgm', 'aq', 'inspector', 'inspector2', 'aqadmin', 'dmgr', 'ocmgr', 'armgr', 'scmgr', 'dsafety', 'dsafety2', 'staff'].includes(x.account))
      .forEach(x => roleSwitch.appendChild(el('option', { value: x.id, text: x.name + '·' + x.role })));
    roleSwitch.value = u.id;
    roleSwitch.addEventListener('change', () => {
      SMS.auth.switchTo(roleSwitch.value);
      SMS.router.buildSidebar();
      SMS.router.render();
      updateUserBlock();
    });

    const userBlock = el('div', { class: 'user-block' });
    function updateUserBlock() {
      const x = SMS.auth.user();
      U.clear(userBlock);
      const av = el('div', { class: 'user-av', text: U.initials(x.name) });
      const info = el('div', { class: 'user-info' }, [
        el('div', { class: 'uname', text: x.name }),
        el('div', { class: 'urole', text: x.role })
      ]);
      userBlock.appendChild(av); userBlock.appendChild(info);
      roleSwitch.value = x.id;
    }

    const logoutBtn = el('button', { class: 'icon-btn', title: '退出登录', html: ui.icon('logout', 17), onClick: () => { SMS.auth.logout(); renderLogin(); } });

    const topbar = el('div', { class: 'topbar' }, [
      el('div', { class: 'topbar-l' }, [
        el('button', { class: 'icon-btn side-toggle', html: ui.icon('filter', 18), onClick: toggleSide }),
        crumb
      ]),
      el('div', { class: 'topbar-r' }, [
        el('span', { class: 'sim-tag', text: '演示数据' }),
        roleSwitch, userBlock, logoutBtn
      ])
    ]);

    const sidebar = el('div', { class: 'sidebar' }, [
      el('div', { class: 'side-logo' }, [
        el('span', { class: 'sl-ic', html: ui.icon('shield', 20) }),
        el('span', { class: 'sl-tx' }, [el('b', { text: 'SMS 安全管理' }), el('small', { text: '机场安全管理系统' })])
      ]),
      sideNav
    ]);

    const main = el('div', { class: 'main' }, [topbar, content]);
    const app = el('div', { class: 'app' }, [sidebar, main]);
    mount.appendChild(app);

    SMS.router.mount(content);
    SMS.router.buildSidebar();
    SMS.router.render();
    updateUserBlock();

    function toggleSide() { app.classList.toggle('side-collapsed'); }
  }

  /* 启动 */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();


</script>
</body>
</html>
