<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMS 机场安全管理系统（预览）</title>
<style>
/* =====================================================================
   SMS 机场安全管理系统 · 全局样式（设计系统）
   配色：主色深蓝 #1F4E79 / 墨绿 #2E6B5E，点缀橙 #E8833A
   浅色内容区，深蓝侧栏；禁止黑色背景。
   ===================================================================== */
:root{
  --brand:#1F4E79; --brand-2:#2E6B9E; --brand-dark:#163A5C;
  --brand-soft:#E8EFF7; --brand-soft2:#F2F6FB;
  --teal:#2E6B5E; --teal-soft:#E6F0EC;
  --accent:#E8833A; --accent-soft:#FBEBDD;
  --ok:#3F8F5C; --ok-soft:#E7F3EC;
  --info:#2E75B6; --info-soft:#E7F0F8;
  --warn:#E0A024; --warn-soft:#FAF1DA;
  --danger:#C0392B; --danger-soft:#F8E7E5;
  --gray:#6B7684; --gray-soft:#EEF1F5;
  --ink:#1F2A37; --ink-2:#4A5563; --muted:#8A94A3;
  --bg:#F3F5F9; --panel:#FFFFFF; --border:#E2E7EE; --border-2:#EDF0F5;
  --shadow:0 1px 2px rgba(31,78,121,.06), 0 4px 14px rgba(31,78,121,.06);
  --shadow-lg:0 10px 40px rgba(22,58,92,.18);
  --radius:8px; --radius-sm:6px;
  --side-w:232px; --top-h:56px;
  --font:"Microsoft YaHei","微软雅黑","PingFang SC","Segoe UI",-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--font);font-size:13px;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;}
a{color:var(--brand);text-decoration:none;}
button{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#c7d0dc;border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:#aab8c8;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- 登录页 ---------- */
.login-wrap{position:fixed;inset:0;display:flex;
  background:linear-gradient(120deg,#163A5C 0%,#1F4E79 46%,#2E6B5E 100%);}
.login-aside{flex:1.15;display:flex;flex-direction:column;justify-content:center;padding:0 7vw;color:#fff;}
.login-aside .logo{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;letter-spacing:1px;}
.login-aside .logo .mark{width:40px;height:40px;border-radius:9px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;}
.login-aside h1{font-size:34px;margin:34px 0 14px;font-weight:700;line-height:1.3;}
.login-aside p{font-size:14px;line-height:1.9;color:rgba(255,255,255,.82);margin:0;max-width:480px;}
.login-aside .pills{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap;}
.login-aside .pills span{font-size:12px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.12);}
.login-box{flex:.85;display:flex;align-items:center;justify-content:center;padding:0 4vw;}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:14px;padding:36px 34px;box-shadow:var(--shadow-lg);}
.login-card h2{margin:0 0 4px;font-size:21px;color:var(--brand-dark);}
.login-card .sub{color:var(--muted);font-size:12.5px;margin-bottom:24px;}
.login-tabs{display:flex;gap:22px;margin-bottom:20px;border-bottom:1px solid var(--border);}
.login-tabs button{border:0;background:none;font-size:13.5px;color:var(--muted);padding:9px 2px;cursor:pointer;border-bottom:2px solid transparent;}
.login-tabs button.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:700;}
.lg-field{margin-bottom:16px;}
.lg-field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px;}
.lg-field .ipt{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 11px;height:40px;background:#fff;}
.lg-field .ipt svg{margin-right:8px;flex:none;}
.lg-field input{border:0;outline:none;flex:1;font-size:13.5px;background:transparent;width:100%;font-family:inherit;}
.lg-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:-4px 0 18px;color:var(--muted);}
.lg-row a{color:var(--brand);}
.btn-login{width:100%;height:42px;border:0;border-radius:var(--radius-sm);background:var(--brand);color:#fff;
  font-size:14.5px;font-weight:700;cursor:pointer;letter-spacing:2px;}
.btn-login:hover{background:var(--brand-dark);}
.login-demo{margin-top:18px;border-top:1px dashed var(--border);padding-top:14px;}
.login-demo p{margin:0 0 8px;font-size:11.5px;color:var(--muted);}
.login-demo .chips{display:flex;flex-wrap:wrap;gap:7px;}
.login-demo .chips button{font-size:11.5px;border:1px solid var(--border);background:var(--brand-soft2);
  color:var(--brand-dark);border-radius:14px;padding:4px 11px;cursor:pointer;}
.login-demo .chips button:hover{background:var(--brand-soft);}
.login-foot{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-size:11.5px;}

/* ---------- 主框架 ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{width:var(--side-w);background:linear-gradient(180deg,#1F4E79 0%,#1A4168 60%,#163A5C 100%);
  color:#cdd9e8;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:30;}
.side-brand{height:var(--top-h);display:flex;align-items:center;gap:10px;padding:0 16px;color:#fff;font-weight:700;font-size:15px;
  border-bottom:1px solid rgba(255,255,255,.08);}
.side-brand .mark{width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex:none;}
.side-nav{flex:1;overflow-y:auto;padding:10px 0 24px;}
.side-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);}
.nav-group{margin-top:6px;}
.nav-group > .grp-title{display:flex;align-items:center;gap:8px;padding:9px 16px 5px;font-size:11px;color:#8FA6C0;
  letter-spacing:1px;text-transform:uppercase;}
.nav-group > .grp-title svg{opacity:.8;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 16px 8px 20px;color:#c4d2e3;font-size:13px;cursor:pointer;border-left:3px solid transparent;white-space:nowrap;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff;border-left-color:var(--accent);font-weight:700;}
.nav-item .nicon{width:16px;flex:none;opacity:.9;}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8FA6C0;line-height:1.6;}

.main{flex:1;margin-left:var(--side-w);display:flex;flex-direction:column;min-width:0;}
.topbar{height:var(--top-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;
  padding:0 20px;gap:14px;position:sticky;top:0;z-index:20;}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);}
.crumb .cur{color:var(--ink);font-weight:700;}
.topbar .spacer{flex:1;}
.top-search{display:flex;align-items:center;background:var(--gray-soft);border-radius:18px;padding:0 12px;height:34px;width:240px;}
.top-search input{border:0;background:transparent;outline:none;flex:1;font-size:12.5px;font-family:inherit;}
.top-icon-btn{position:relative;width:36px;height:36px;border-radius:50%;border:0;background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);}
.top-icon-btn:hover{background:var(--gray-soft);}
.top-icon-btn .dot{position:absolute;top:6px;right:7px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:var(--danger);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;}
.role-switch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--brand-soft2);
  border:1px solid var(--border);border-radius:16px;padding:0 10px;height:32px;cursor:pointer;}
.role-switch select{border:0;background:transparent;outline:none;font-size:12px;font-family:inherit;color:var(--brand-dark);cursor:pointer;}
.user-chip{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 6px;border-radius:20px;}
.user-chip:hover{background:var(--gray-soft);}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--teal));color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;}
.user-chip .meta{line-height:1.25;}
.user-chip .meta .nm{font-size:12.5px;font-weight:700;color:var(--ink);}
.user-chip .meta .rl{font-size:11px;color:var(--muted);}

.content{padding:18px 20px 30px;flex:1;}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.page-head h2{margin:0;font-size:17px;color:var(--brand-dark);display:flex;align-items:center;gap:9px;}
.page-head .desc{font-size:12px;color:var(--muted);margin-top:3px;font-weight:400;}
.page-head .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* ---------- 通用组件 ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-h{padding:12px 16px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;justify-content:space-between;}
.card-h .t{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;}
.card-b{padding:14px 16px;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);} .g6{grid-template-columns:repeat(6,1fr);}
.row{display:flex;gap:14px;}.col{flex:1;min-width:0;}
.mt{margin-top:14px;}.mb{margin-bottom:14px;}.mr{margin-right:8px;}
.muted{color:var(--muted);}.small{font-size:11.5px;}.strong{font-weight:700;}
.tc{text-align:center;}.tr{text-align:right;}.nowrap{white-space:nowrap;}

.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:13px;position:relative;overflow:hidden;}
.stat-card .sic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
.stat-card .sv{font-size:23px;font-weight:700;line-height:1.1;color:var(--ink);}
.stat-card .sl{font-size:12px;color:var(--muted);margin-top:2px;}
.stat-card .ss{font-size:11px;margin-top:3px;}
.stat-card .ss.up{color:var(--danger);} .stat-card .ss.down{color:var(--ok);}
.stat-card .bar{position:absolute;left:0;top:0;bottom:0;width:3px;}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;color:var(--ink-2);
  padding:7px 13px;border-radius:var(--radius-sm);font-size:12.5px;cursor:pointer;white-space:nowrap;}
.btn:hover{border-color:var(--brand);color:var(--brand);}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);color:#fff;}
.btn-teal{background:var(--teal);border-color:var(--teal);color:#fff;}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-danger{background:#fff;border-color:var(--danger);color:var(--danger);}
.btn-sm{padding:4px 9px;font-size:11.5px;border-radius:5px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:11px;font-size:11.5px;font-weight:400;
  background:var(--gray-soft);color:var(--gray);white-space:nowrap;}
.badge.blue{background:var(--info-soft);color:var(--info);}
.badge.green{background:var(--ok-soft);color:var(--ok);}
.badge.orange{background:var(--accent-soft);color:var(--accent);}
.badge.red{background:var(--danger-soft);color:var(--danger);}
.badge.yellow{background:var(--warn-soft);color:#B9830B;}
.badge.teal{background:var(--teal-soft);color:var(--teal);}
.badge.strong{font-weight:700;}

/* 筛选条 */
.filter-bar{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;box-shadow:var(--shadow);}
.filter-item{display:flex;flex-direction:column;gap:5px;}
.filter-item label{font-size:11.5px;color:var(--muted);}
.filter-item input,.filter-item select{height:32px;border:1px solid var(--border);border-radius:5px;padding:0 9px;font-size:12.5px;
  font-family:inherit;background:#fff;outline:none;min-width:130px;color:var(--ink);}
.filter-item input:focus,.filter-item select:focus{border-color:var(--brand);}
.filter-actions{display:flex;gap:8px;margin-left:auto;}

/* 表格 */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.table-tool{padding:11px 14px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.table-tool .t{font-weight:700;font-size:13.5px;color:var(--ink);}
.table-scroll{overflow-x:auto;}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;}
table.dt th{background:var(--brand-soft2);color:var(--brand-dark);font-weight:700;text-align:left;padding:10px 12px;
  border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px;}
table.dt td{padding:9px 12px;border-bottom:1px solid var(--border-2);color:var(--ink-2);vertical-align:middle;}
table.dt tr:hover td{background:var(--brand-soft2);}
table.dt tr.overdue td{background:var(--danger-soft);}
table.dt tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--danger);}
table.dt .col-act{white-space:nowrap;text-align:right;}
table.dt .act-link{color:var(--brand);cursor:pointer;margin-left:10px;font-size:12px;}
table.dt .act-link:hover{text-decoration:underline;}
table.dt .act-link.danger{color:var(--danger);}
table.dt .cell-main{color:var(--ink);font-weight:400;}
table.dt .cell-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.pager{padding:10px 14px;display:flex;align-items:center;gap:8px;justify-content:flex-end;font-size:12px;color:var(--muted);}
.pager button{min-width:30px;height:28px;border:1px solid var(--border);background:#fff;border-radius:5px;cursor:pointer;color:var(--ink-2);}
.pager button.cur{background:var(--brand);color:#fff;border-color:var(--brand);}
.pager button[disabled]{opacity:.45;cursor:not-allowed;}

/* 弹窗 / 抽屉 */
.modal-mask{position:fixed;inset:0;background:rgba(22,42,66,.45);z-index:60;display:flex;align-items:flex-start;
  justify-content:center;padding:6vh 16px;}
.modal{background:#fff;border-radius:10px;width:100%;max-width:640px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;max-height:88vh;}
.modal.lg{max-width:920px;} .modal.xl{max-width:1120px;}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-h .t{font-size:15px;font-weight:700;color:var(--brand-dark);}
.modal-x{border:0;background:transparent;font-size:18px;color:var(--muted);cursor:pointer;line-height:1;}
.modal-b{padding:18px;overflow-y:auto;}
.modal-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;background:#fafbfc;}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px 16px;}
.form-grid .span2{grid-column:span 2;}
.f-item{display:flex;flex-direction:column;gap:5px;}
.f-item label{font-size:12px;color:var(--ink-2);}
.f-item label .req{color:var(--danger);margin-right:2px;}
.f-item input,.f-item select,.f-item textarea{border:1px solid var(--border);border-radius:5px;padding:8px 10px;font-size:12.5px;
  font-family:inherit;outline:none;background:#fff;color:var(--ink);width:100%;}
.f-item textarea{resize:vertical;min-height:64px;}
.f-item input:focus,.f-item select:focus,.f-item textarea:focus{border-color:var(--brand);}
.f-item .help{font-size:11px;color:var(--muted);}
.f-item.err input,.f-item.err select,.f-item.err textarea{border-color:var(--danger);}
.f-item .errmsg{font-size:11px;color:var(--danger);}
.f-item input[type=file]{padding:6px;}
.f-readonly{background:var(--gray-soft)!important;color:var(--ink-2);}

/* 标签页 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap;}
.tabs button{border:0;background:none;padding:9px 15px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
.tabs button.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:700;}
.tabs button .cnt{display:inline-block;min-width:18px;padding:0 5px;height:16px;line-height:16px;border-radius:9px;
  background:var(--gray-soft);color:var(--gray);font-size:10.5px;margin-left:5px;}
.tabs button.active .cnt{background:var(--brand-soft);color:var(--brand);}

/* 时间线 / 审批流 */
.timeline{position:relative;padding-left:22px;}
.timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--border);}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item .node{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--border);}
.tl-item.done .node{border-color:var(--ok);background:var(--ok);}
.tl-item.current .node{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.tl-item.reject .node{border-color:var(--danger);background:var(--danger);}
.tl-item .tl-t{font-size:12.5px;font-weight:700;color:var(--ink);}
.tl-item .tl-m{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;}
.tl-item .tl-tag{margin-left:8px;}
.approval-steps{display:flex;background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
.approval-step{flex:1;padding:13px 16px;border-right:1px solid var(--border);position:relative;}
.approval-step:last-child{border-right:0;}
.approval-step .as-no{font-size:11px;color:var(--muted);}
.approval-step .as-t{font-size:13px;font-weight:700;margin:3px 0;color:var(--ink);}
.approval-step .as-m{font-size:11px;color:var(--muted);}
.approval-step.done{background:var(--ok-soft);}
.approval-step.done .as-t{color:var(--ok);}
.approval-step.current{background:var(--accent-soft);}
.approval-step.current .as-t{color:var(--accent);}

/* 图表 */
.chart{width:100%;}
.chart-hint{font-size:11px;color:var(--muted);}
.legend-inline{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);}
.legend-inline i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;}

/* 空态 / 提示 */
.empty{padding:44px 16px;text-align:center;color:var(--muted);}
.empty svg{margin-bottom:10px;opacity:.5;}
.empty .et{font-size:13px;}
.empty .es{font-size:11.5px;margin-top:5px;}
.toast-wrap{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:9px;align-items:center;}
.toast{background:var(--brand-dark);color:#fff;padding:9px 18px;border-radius:7px;font-size:12.5px;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:8px;animation:toastIn .2s ease;}
.toast.ok{background:var(--ok);} .toast.err{background:var(--danger);} .toast.warn{background:var(--warn);}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

.sim-tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:1px 7px;border-radius:3px;background:var(--warn-soft);
  color:#9a7010;border:1px dashed #d9b25a;}

/* 详情描述列表 */
.desc-list{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
.desc-list .di{display:flex;border-bottom:1px solid var(--border-2);min-height:38px;}
.desc-list .di .dt{width:120px;background:var(--brand-soft2);color:var(--brand-dark);font-size:12px;padding:9px 12px;flex:none;}
.desc-list .di .dd{flex:1;padding:9px 12px;font-size:12.5px;color:var(--ink);}
.desc-list.full .di{grid-column:span 2;}
.section-title{font-size:13.5px;font-weight:700;color:var(--brand-dark);margin:18px 0 10px;padding-left:9px;border-left:3px solid var(--accent);}

/* 风险矩阵热力图 */
.risk-matrix{display:grid;grid-template-columns:60px repeat(5,1fr);gap:4px;font-size:11.5px;}
.risk-matrix .rm-h{text-align:center;color:var(--muted);font-size:11px;align-self:center;}
.risk-matrix .rm-l{color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;}
.rm-cell{border-radius:5px;padding:8px 4px;text-align:center;color:#fff;cursor:default;min-height:46px;display:flex;flex-direction:column;justify-content:center;}
.rm-cell .rm-n{font-size:15px;font-weight:700;}
.rm-cell .rm-c{font-size:10.5px;opacity:.92;}

/* 看板专用 */
.kanban-col{display:flex;flex-direction:column;gap:10px;}
.kanban-item{border:1px solid var(--border);border-radius:6px;padding:9px 11px;background:#fff;cursor:pointer;}
.kanban-item:hover{border-color:var(--brand);box-shadow:var(--shadow);}
.kanban-item .ki-t{font-size:12.5px;color:var(--ink);}
.kanban-item .ki-m{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted);}
.list-feed{display:flex;flex-direction:column;}
.feed-item{display:flex;gap:11px;padding:10px 2px;border-bottom:1px solid var(--border-2);cursor:pointer;}
.feed-item:last-child{border-bottom:0;}
.feed-item .fi-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;}
.feed-item .fi-body{flex:1;min-width:0;}
.feed-item .fi-t{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.feed-item .fi-m{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:10px;}
.progress{height:7px;background:var(--gray-soft);border-radius:4px;overflow:hidden;}
.progress > i{display:block;height:100%;background:var(--brand);border-radius:4px;}
.progress.ok > i{background:var(--ok);} .progress.warn > i{background:var(--warn);} .progress.danger > i{background:var(--danger);}

/* 移动端模拟壳 */
.phone-shell{width:380px;max-width:100%;margin:0 auto;border:10px solid #1f2a37;border-radius:34px;background:#fff;
  height:760px;overflow:hidden;box-shadow:var(--shadow-lg);position:relative;}
.phone-shell .phone-status{height:30px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;font-size:11px;}
.phone-shell .phone-body{height:calc(100% - 30px);overflow-y:auto;background:var(--bg);}
.phone-tabbar{position:absolute;left:0;right:0;bottom:0;height:54px;background:#fff;border-top:1px solid var(--border);
  display:flex;}
.phone-tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:10.5px;color:var(--muted);cursor:pointer;}
.phone-tabbar button.active{color:var(--brand);}
.m-card{background:#fff;border-radius:9px;margin:11px;padding:13px;box-shadow:var(--shadow);}
.m-list-item{display:flex;align-items:center;gap:10px;background:#fff;padding:12px 14px;border-bottom:1px solid var(--border-2);cursor:pointer;}
.m-list-item .ml-body{flex:1;min-width:0;}
.m-list-item .ml-t{font-size:13px;color:var(--ink);}
.m-list-item .ml-m{font-size:11px;color:var(--muted);margin-top:3px;}
.m-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.m-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:11px;}
.m-quick .mq{background:#fff;border-radius:9px;padding:12px 4px;text-align:center;font-size:11px;color:var(--ink-2);cursor:pointer;box-shadow:var(--shadow);}
.m-quick .mq .mq-ic{font-size:20px;margin-bottom:5px;}

@media (max-width:1100px){ .g4,.g6{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:1fr;} }

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>

<script>
/* ===== core/util.js ===== */
/* =====================================================================
   core/util.js — 通用工具（DOM、日期、编号、文本、相似度、格式化）
   全局命名空间：window.SMS
   ===================================================================== */
(function () {
  'use strict';
  const SMS = window.SMS || (window.SMS = {});

  const util = {
    /* ---------- DOM ---------- */
    el(tag, attrs, children) {
      const e = document.createElement(tag);
      if (attrs) {
        for (const k in attrs) {
          const v = attrs[k];
          if (v == null || v === false) continue;
          if (k === 'class' || k === 'className') e.className = v;
          else if (k === 'html') e.innerHTML = v;
          else if (k === 'text') e.textContent = v;
          else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
          else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
          else if (k === 'dataset') Object.assign(e.dataset, v);
          else if (v === true) e.setAttribute(k, '');
          else e.setAttribute(k, v);
        }
      }
      (children || []).forEach(c => {
        if (c == null || c === false) return;
        e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
      });
      return e;
    },
    qs(sel, root) { return (root || document).querySelector(sel); },
    qsa(sel, root) { return Array.from((root || document).querySelectorAll(sel)); },
    on(node, ev, fn, opt) { node.addEventListener(ev, fn, opt); return node; },
    clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; },

    /* ---------- 类型 / 对象 ---------- */
    isObject(v) { return v && typeof v === 'object' && !Array.isArray(v); },
    clone(v) { return JSON.parse(JSON.stringify(v)); },
    merge() { return Object.assign.apply(null, [{}].concat([].slice.call(arguments))); },
    pick(o, keys) { const r = {}; keys.forEach(k => { if (o[k] !== undefined) r[k] = o[k]; }); return r; },
    groupBy(arr, key) {
      const fn = typeof key === 'function' ? key : (x) => x[key];
      return arr.reduce((m, x) => { const k = fn(x); (m[k] = m[k] || []).push(x); return m; }, {});
    },
    sortBy(arr, fn, dir) {
      const f = typeof fn === 'function' ? fn : (x) => x[fn];
      const a = arr.slice().sort((x, y) => {
        const vx = f(x), vy = f(y);
        if (vx == null) return 1; if (vy == null) return -1;
        return vx > vy ? 1 : vx < vy ? -1 : 0;
      });
      return dir === 'desc' ? a.reverse() : a;
    },
    uniq(arr) { return Array.from(new Set(arr)); },
    sum(arr, fn) { return arr.reduce((s, x) => s + (fn ? fn(x) : (x || 0)), 0); },
    avg(arr, fn) { return arr.length ? util.sum(arr, fn) / arr.length : 0; },
    round(n, d) { const p = Math.pow(10, d || 0); return Math.round(n * p) / p; },
    clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); },

    /* ---------- 编号 / ID ---------- */
    uid(prefix) {
      const t = Date.now().toString(36);
      const r = Math.random().toString(36).slice(2, 7);
      return (prefix || 'ID') + '-' + t + r;
    },
    seqCode(prefix, n, width) {
      return prefix + '-' + String(n).padStart(width || 4, '0');
    },
    nextSeq(table, prefix, width) {
      const st = SMS.store;
      const rows = st.all(table);
      let max = 0;
      rows.forEach(r => {
        const m = (r.code || r.id || '').match(/(\d+)\s*$/);
        if (m) max = Math.max(max, parseInt(m[1], 10));
      });
      return util.seqCode(prefix, max + 1, width);
    },

    /* ---------- 日期 ---------- */
    now() { return new Date(); },
    today() { return util.fmtDate(new Date()); },
    nowStr() { return util.fmtDateTime(new Date()); },
    fmtDate(d) {
      d = d instanceof Date ? d : new Date(d);
      if (isNaN(d)) return '';
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    },
    fmtDateTime(d) {
      d = d instanceof Date ? d : new Date(d);
      if (isNaN(d)) return '';
      const p = n => String(n).padStart(2, '0');
      return util.fmtDate(d) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    },
    parse(s) { return s ? new Date(s.replace(/-/g, '/')) : null; },
    addDays(d, n) { const x = d instanceof Date ? new Date(d) : new Date(d.replace(/-/g, '/')); x.setDate(x.getDate() + n); return x; },
    addMonths(d, n) { const x = new Date((d instanceof Date ? d : d.replace(/-/g, '/'))); x.setMonth(x.getMonth() + n); return x; },
    daysBetween(a, b) {
      const da = a instanceof Date ? a : new Date(a.replace(/-/g, '/'));
      const db = b instanceof Date ? b : new Date(b.replace(/-/g, '/'));
      return Math.round((db - da) / 86400000);
    },
    monthKey(d) { d = d instanceof Date ? d : new Date(d.replace(/-/g, '/')); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); },
    /* 返回相对期限状态：过期/临期/正常 */
    dueState(due, warnDays) {
      if (!due) return 'normal';
      const left = util.daysBetween(new Date(), due);
      if (left < 0) return 'overdue';
      if (left <= (warnDays == null ? 7 : warnDays)) return 'due';
      return 'normal';
    },

    /* ---------- 文本 ---------- */
    truncate(s, n) { s = s || ''; return s.length > n ? s.slice(0, n) + '…' : s; },
    /* 简易中文分词（2-gram + 关键词），用于相似度/RAG 检索 */
    tokenize(s) {
      if (!s) return [];
      s = String(s).toLowerCase().replace(/[\s\r\n\t，。、；：！？（）()\[\]【】.,;:!?""''"'']/g, ' ');
      const toks = s.split(' ').filter(Boolean);
      const zh = String(s).replace(/[^\u4e00-\u9fa5]/g, '');
      const grams = [];
      for (let i = 0; i < zh.length - 1; i++) grams.push(zh.substr(i, 2));
      return util.uniq(toks.concat(grams));
    },
    /* Jaccard 文本相似度（0~1） */
    similarity(a, b) {
      const A = new Set(util.tokenize(a)), B = new Set(util.tokenize(b));
      if (!A.size || !B.size) return 0;
      let inter = 0;
      A.forEach(t => { if (B.has(t)) inter++; });
      return inter / (A.size + B.size - inter);
    },
    /* BM25 简易检索，返回 [{item,score}] */
    bm25(query, items, field, k1, b) {
      k1 = k1 || 1.5; b = b == null ? 0.75 : b;
      const docs = items.map(it => util.tokenize(typeof field === 'function' ? field(it) : it[field]));
      const N = docs.length;
      const avgdl = util.sum(docs, d => d.length) / (N || 1);
      const df = {};
      docs.forEach(d => util.uniq(d).forEach(t => df[t] = (df[t] || 0) + 1));
      const qt = util.tokenize(query);
      return items.map((it, i) => {
        const d = docs[i]; const tf = {};
        d.forEach(t => tf[t] = (tf[t] || 0) + 1);
        let score = 0;
        qt.forEach(t => {
          if (!df[t]) return;
          const idf = Math.log(1 + (N - df[t] + 0.5) / (df[t] + 0.5));
          const f = tf[t] || 0;
          score += idf * (f * (k1 + 1)) / (f + k1 * (1 - b + b * d.length / (avgdl || 1)));
        });
        return { item: it, score };
      }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
    },

    /* ---------- 数字 / 百分比 ---------- */
    pct(part, total, d) {
      if (!total) return 0;
      return util.round(part / total * 100, d == null ? 1 : d);
    },
    fmtNum(n, d) {
      if (n == null || n === '' || isNaN(n)) return '-';
      return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
    },

    /* ---------- 杂项 ---------- */
    download(filename, content, mime) {
      const blob = new Blob([content], { type: mime || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = util.el('a', { href: url, download: filename });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    },
    exportCSV(filename, columns, rows) {
      const head = columns.map(c => '"' + (c.title || c) + '"').join(',');
      const body = rows.map(r => columns.map(c => {
        const v = c.field ? r[c.field] : '';
        return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      }).join(',')).join('\r\n');
      util.download(filename, '\ufeff' + head + '\r\n' + body, 'text/csv;charset=utf-8');
    },
    debounce(fn, ms) { let t; return function () { const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); }; },
    escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    },
    /* 由姓/名生成头像文字 */
    initials(name) {
      if (!name) return '?';
      return name.length > 2 ? name.slice(-2) : name;
    }
  };

  SMS.util = util;
  window.SMS = SMS;
})();


/* ===== core/store.js ===== */
/* =====================================================================
   core/store.js — 数据访问层
   - 内存库 + localStorage 持久化（file:// 可用、同步、零安装）
   - 种子注册：registerSeed(table, rows, opts)
   - 通用 CRUD / 查询 / 元数据（定时任务用）
   生产环境对应：MySQL/SQL Server + Redis + 分布式对象存储（见 PDS）
   ===================================================================== */
(function () {
  'use strict';
  const SMS = window.SMS || (window.SMS = {});
  const U = SMS.util;
  const DB_KEY = 'SMS_DB_V2';
  const META_KEY = 'SMS_META_V2';

  let db = {};
  let meta = {};
  const seeds = {};            // table -> {rows, opts}
  let saveTimer = null;

  function persist() {
    try {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      localStorage.setItem(META_KEY, JSON.stringify(meta));
    } catch (e) {
      console.warn('持久化失败（可能超出本地存储配额）：', e);
    }
  }
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 120);
  }

  const store = {
    _seeds: seeds,
    /* ---------- 种子 ---------- */
    registerSeed(table, rows, opts) {
      seeds[table] = { rows: U.clone(rows || []), opts: opts || {} };
    },
    /* 从种子构建（版本变更或首次） */
    buildFromSeeds() {
      db = {};
      for (const t in seeds) {
        const s = seeds[t];
        db[t] = U.clone(s.rows);
      }
      meta = { bootAt: U.fmtDateTime(new Date()), version: 2, jobs: {} };
      persist();
      return db;
    },
    /* ---------- 生命周期 ---------- */
    init() {
      let raw = null, mraw = null;
      try { raw = localStorage.getItem(DB_KEY); mraw = localStorage.getItem(META_KEY); } catch (e) {}
      if (raw) {
        try { db = JSON.parse(raw); meta = mraw ? JSON.parse(mraw) : { jobs: {} }; }
        catch (e) { db = this.buildFromSeeds(); }
      } else {
        db = this.buildFromSeeds();
      }
      // 补齐后注册的种子表（新增模块的表）
      let added = false;
      for (const t in seeds) {
        if (!db[t]) { db[t] = U.clone(seeds[t].rows); added = true; }
      }
      if (added) persist();
      return db;
    },
    reset() {
      db = this.buildFromSeeds();
      return db;
    },
    saveNow() { persist(); },

    /* ---------- 读 ---------- */
    tables() { return Object.keys(db); },
    all(table) { return db[table] || (db[table] = []); },
    get(table, id) { return this.all(table).find(r => String(r.id) === String(id)); },
    find(table, pred) { return this.all(table).find(pred); },
    filter(table, pred) { return pred ? this.all(table).filter(pred) : this.all(table).slice(); },
    count(table, pred) { return pred ? this.all(table).filter(pred).length : this.all(table).length; },
    map(table, fn) { return this.all(table).map(fn); },
    /* 多条件查询：conds 为字段→值（或数组表示枚举） */
    query(table, conds) {
      return this.all(table).filter(r => {
        for (const k in conds) {
          let cv = conds[k];
          if (cv == null || cv === '') continue;
          if (Array.isArray(cv)) { if (!cv.map(String).includes(String(r[k]))) return false; }
          else if (String(r[k]) !== String(cv)) return false;
        }
        return true;
      });
    },

    /* ---------- 写 ---------- */
    insert(table, rec) {
      const rows = this.all(table);
      if (!rec.id) rec.id = U.uid(table);
      rec.createdAt = rec.createdAt || U.fmtDateTime(new Date());
      rec.updatedAt = U.fmtDateTime(new Date());
      rows.push(rec);
      scheduleSave();
      return rec;
    },
    insertMany(table, list) { list.forEach(r => this.insert(table, r)); return list; },
    update(table, id, patch) {
      const rec = this.get(table, id);
      if (!rec) return null;
      Object.assign(rec, patch);
      rec.updatedAt = U.fmtDateTime(new Date());
      scheduleSave();
      return rec;
    },
    /* 字段级自增（如积分、计数） */
    inc(table, id, field, n) {
      const rec = this.get(table, id);
      if (!rec) return null;
      rec[field] = (Number(rec[field]) || 0) + (n == null ? 1 : n);
      rec.updatedAt = U.fmtDateTime(new Date());
      scheduleSave();
      return rec;
    },
    upsert(table, rec, keyField) {
      const kf = keyField || 'id';
      const exist = this.all(table).find(r => String(r[kf]) === String(rec[kf]));
      if (exist) return this.update(table, exist.id, rec);
      return this.insert(table, rec);
    },
    remove(table, id) {
      const rows = this.all(table);
      const i = rows.findIndex(r => String(r.id) === String(id));
      if (i < 0) return false;
      rows.splice(i, 1); scheduleSave(); return true;
    },

    /* ---------- 元数据（定时任务/系统状态） ---------- */
    meta() { return meta; },
    getMeta(k, d) { return meta[k] == null ? d : meta[k]; },
    setMeta(k, v) { meta[k] = v; scheduleSave(); },
    /* 作业每日只执行一次：返回今日是否已运行 */
    jobRanToday(jobName) {
      const jobs = meta.jobs || (meta.jobs = {});
      return jobs[jobName] === U.today();
    },
    markJob(jobName) {
      const jobs = meta.jobs || (meta.jobs = {});
      jobs[jobName] = U.today();
      scheduleSave();
    }
  };

  SMS.store = store;
  window.SMS = SMS;
})();


/* ===== core/auth.js ===== */
/* =====================================================================
   core/auth.js — 认证、角色、权限、数据范围
   - 日常入口为统一登录（模拟 OA/SSO），并保留本系统应急登录
   - 内置 7 类角色；操作权限 + 数据范围（公司/部门）
   生产环境对应：统一认证平台 + JWT + RBAC/数据权限（见 PDS）
   ===================================================================== */
(function () {
  'use strict';
  const SMS = window.SMS || (window.SMS = {});
  const U = SMS.util;
  const SESSION_KEY = 'SMS_SESSION';

  /* 角色常量 */
  const ROLES = {
    EMP: '员工',
    CLEADER: '公司领导',
    DLEADER: '部门领导',
    AQLEADER: '安质部领导',
    INSPECTOR: '安质部监察员',
    DSAFETY: '部门安全员',
    ADMIN: '系统管理员'
  };

  /* 操作权限（动作键）。未列出的角色不具备该动作。 */
  const ACTIONS = {
    'policy:publish': [ROLES.CLEADER, ROLES.AQLEADER],
    'risk:manage': [ROLES.AQLEADER, ROLES.INSPECTOR, ROLES.DSAFETY, ROLES.ADMIN],
    'risk:accept': [ROLES.CLEADER, ROLES.AQLEADER],
    'hazard:manage': [ROLES.AQLEADER, ROLES.INSPECTOR, ROLES.DSAFETY, ROLES.ADMIN],
    'report:audit': [ROLES.AQLEADER, ROLES.INSPECTOR],
    'report:handle': [ROLES.DSAFETY, ROLES.DLEADER],
    'investigation:lead': [ROLES.AQLEADER, ROLES.CLEADER],
    'inspection:plan': [ROLES.AQLEADER, ROLES.INSPECTOR],
    'inspection:execute': [ROLES.INSPECTOR, ROLES.DSAFETY],
    'inspection:verify': [ROLES.INSPECTOR, ROLES.AQLEADER, ROLES.DSAFETY],
    'audit:manage': [ROLES.AQLEADER, ROLES.CLEADER],
    'performance:manage': [ROLES.AQLEADER, ROLES.INSPECTOR],
    'training:manage': [ROLES.AQLEADER, ROLES.DSAFETY, ROLES.ADMIN],
    'exam:manage': [ROLES.AQLEADER, ROLES.DSAFETY],
    'culture:manage': [ROLES.AQLEADER, ROLES.DSAFETY],
    'supervision:manage': [ROLES.AQLEADER, ROLES.INSPECTOR, ROLES.DSAFETY],
    'permit:audit': [ROLES.AQLEADER, ROLES.INSPECTOR],
    'capability:manage': [ROLES.AQLEADER, ROLES.INSPECTOR],
    'service:manage': [ROLES.DLEADER, ROLES.DSAFETY],
    'system:manage': [ROLES.ADMIN]
  };

  /* 公司级数据范围角色（可见全部部门） */
  const COMPANY_SCOPED = [ROLES.CLEADER, ROLES.AQLEADER, ROLES.INSPECTOR, ROLES.ADMIN];

  let currentUser = null;

  function loadSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (raw) currentUser = JSON.parse(raw);
    } catch (e) {}
  }
  function saveSession() {
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser)); } catch (e) {}
  }

  const auth = {

    login(account, password) {
      const user = SMS.store.find('users', u => u.account === account);
      if (!user) return { ok: false, msg: '账号不存在' };
      if (user.status === '停用') return { ok: false, msg: '该账号已停用，请联系管理员' };
      if (user.password !== password) return { ok: false, msg: '密码错误' };
      currentUser = U.clone(user);
      currentUser.token = U.uid('TK');
      currentUser.loginAt = U.fmtDateTime(new Date());
      saveSession();
      this.logLogin('应急登录');
      return { ok: true, user: currentUser };
    },
    /* 统一登录（模拟 SSO/OA）：直接以指定演示账号进入，标注“模拟” */
    ssoLogin(account) {
      const user = SMS.store.find('users', u => u.account === (account || 'admin'));
      if (!user) return { ok: false, msg: '统一认证用户未同步' };
      currentUser = U.clone(user);
      currentUser.token = U.uid('SSO');
      currentUser.loginAt = U.fmtDateTime(new Date());
      currentUser.viaSSO = true;
      saveSession();
      this.logLogin('统一登录(模拟)');
      return { ok: true, user: currentUser };
    },
    /* 演示用：切换角色（无需密码），并记录日志 */
    switchTo(userId) {
      const user = SMS.store.get('users', userId);

      currentUser = U.clone(user);
      currentUser.token = U.uid('TK');
      currentUser.loginAt = U.fmtDateTime(new Date());
      saveSession();
      this.logLogin('角色切换');
      return { ok: true, user: currentUser };
    },
    logout() {
      if (currentUser) this.logLogin('退出登录');

      try {
        SMS.store.insert('loginLogs', {
          userId: currentUser.id, name: currentUser.name, account: currentUser.account,
          role: currentUser.role, deptId: currentUser.deptId,
          action, time: U.fmtDateTime(new Date()), ip: '192.168.10.' + (20 + (currentUser.id.length % 80))
        });
      } catch (e) {}
    },

    /* ---------- 状态 ---------- */
    user() { return currentUser; },
    isAuthed() { return !!currentUser; },
    role() { return currentUser ? currentUser.role : null; },
    isCompanyScope() { return currentUser ? COMPANY_SCOPED.includes(currentUser.role) : false; },
    /* 数据范围：返回可见部门 id（公司级为 null=全部） */
    scopeDept() {
      if (!currentUser) return null;
      return COMPANY_SCOPED.includes(currentUser.role) ? null : currentUser.deptId;
    },
    /* 按数据范围过滤记录（记录含 deptId / 责任部门字段） */
    scoped(rows, deptField) {
      const f = deptField || 'deptId';

      if (d == null) return rows;
      return rows.filter(r => r[f] === d || r.respDeptId === d);

    /* ---------- 权限判定 ---------- */
    can(action) {
      if (!currentUser) return false;

    /* 路由/菜单可见：routeDef.roles 缺省为全部可见 */
    canRoute(routeDef) {
      if (!currentUser) return false;
      if (!routeDef || !routeDef.roles || !routeDef.roles.length) return true;
      return routeDef.roles.includes(currentUser.role);
    },
    /* 便捷：是否任一角色 */
    hasRole() {
      if (!currentUser) return false;
      return [].slice.call(arguments).includes(currentUser.role);
    }

  loadSession();
  window.SMS = SMS;

      const cnt = t.count != null ? '<span class="cnt">' + t.count + '</span>' : '';
      const b = el('button', { html: U.escapeHtml(t.label) + cnt });
      b.addEventListener('click', () => select(t.key));
      bar.appendChild(b); btns[t.key] = b;
    });
    function select(key) {
      for (const k in btns) btns[k].classList.toggle('active', k === key);
      U.clear(body);
      const t = opts.tabs.find(x => x.key === key);
      const r = t.render(body);
      if (r) body.appendChild(r);
      if (opts.onChange) opts.onChange(key);
    }
    wrap.appendChild(bar); wrap.appendChild(body);
    select(opts.active || opts.tabs[0].key);
    return wrap;
  }

  /* ============ Timeline / Approval ============ */
  function timeline(items) {
    const tl = el('div', { class: 'timeline' });
    items.forEach(it => {
      const i = el('div', { class: 'tl-item ' + (it.state || '') }, [
        el('div', { class: 'node' }),
        el('div', { class: 'tl-t' }, [document.createTextNode(it.title), it.tag ? el('span', { class: 'tl-tag' }, [it.tag]) : null]),
        el('div', { class: 'tl-m', html: it.meta || '' })
      ]);
      tl.appendChild(i);
    });
    return tl;
  }
  function approvalSteps(steps, current) {
    const wrap = el('div', { class: 'approval-steps' });
    steps.forEach((s, i) => {
      const st = i < current ? 'done' : i === current ? 'current' : '';
      const step = el('div', { class: 'approval-step ' + st }, [
        el('div', { class: 'as-no', text: '环节 ' + (i + 1) }),
        el('div', { class: 'as-t', text: s.title }),
        el('div', { class: 'as-m', html: s.meta || '' })
      ]);
      wrap.appendChild(step);
    });
    return wrap;
  }

  /* ============ 图表 ============ */
  const chartInsts = [];
  function chart(node, option) {
    if (!window.echarts) { node.appendChild(el('div', { class: 'empty', text: '图表库未加载' })); return null; }
    const c = echarts.init(node);
    c.setOption(option);
    chartInsts.push(c);
    return c;
  }
  function baseOption(o) {
    return Object.assign({
      color: PALETTE,
      textStyle: { fontFamily: 'Microsoft YaHei', fontSize: 11, color: '#4A5563' },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      grid: { left: 44, right: 18, top: 38, bottom: 30, containLabel: true },
      legend: { top: 4, textStyle: { fontSize: 11 } }
    }, o);
  }
  window.addEventListener('resize', U.debounce(() => chartInsts.forEach(c => { try { c.resize(); } catch (e) {} }), 200));

  /* ============ 空态 ============ */
  function empty(text, sub) {
    return el('div', { class: 'empty' }, [
      el('span', { html: icon('search', 34) }),
      el('div', { class: 'et', text: text || '暂无数据' }),
      sub ? el('div', { class: 'es', text: sub }) : null
    ]);
  }

  /* ============ 详情描述列表 ============ */
  function descList(items, cols) {
    const wrap = el('div', { class: 'desc-list' + (cols === 1 ? ' full' : '') });
    items.forEach(it => {
      const di = el('div', { class: 'di' + (it.full ? ' full' : '') }, [
        el('div', { class: 'dt', text: it.label }),
        el('div', { class: 'dd', html: it.valueDom ? '' : (it.value == null || it.value === '' ? '—' : U.escapeHtml(String(it.value))) })
      ]);
      if (it.valueDom) di.querySelector('.dd').appendChild(it.valueDom);
      wrap.appendChild(di);
    });
    return wrap;
  }

  /* ============ CRUD 页面工厂 ============ */
  function crudPage(cfg) {
    const root = el('div');
    const state = { filters: {}, page: 1, sort: cfg.defaultSort || null, selected: new Set() };
    const pageSize = cfg.pageSize || 10;

    function getData() {
      let rows = cfg.data ? cfg.data() : SMS.store.all(cfg.table);
      rows = rows.filter(r => {
        for (const f of cfg.filters || []) {
          const v = state.filters[f.field];
          if (v == null || v === '') continue;
          if (f.type === 'text') {
            const tv = String(r[f.field] == null ? '' : r[f.field]);
            if (tv.toLowerCase().indexOf(String(v).toLowerCase()) < 0) return false;
          } else if (String(r[f.field]) !== String(v)) return false;
        }
        return true;
      });
      if (state.sort) {
        rows = U.sortBy(rows, state.sort.field, state.sort.dir);
      }
      return rows;
    }

    function head() {
      const h = el('div', { class: 'page-head' }, [
        el('div', null, [
          el('h2', { html: (cfg.icon ? icon(cfg.icon, 19) + ' ' : '') + U.escapeHtml(cfg.title) }),
          cfg.subtitle ? el('div', { class: 'desc', text: cfg.subtitle }) : null
        ]),
        el('div', { class: 'actions' })
      ]);
      const act = h.querySelector('.actions');
      if (cfg.extraActions) cfg.extraActions.forEach(a => act.appendChild(btnFrom(a)));
      if (cfg.exportable !== false) {
        act.appendChild(el('button', { class: 'btn', html: icon('download') + ' 导出', onClick: doExport }));
      }
      const addable = cfg.addable == null ? true : (typeof cfg.addable === 'function' ? cfg.addable() : cfg.addable);
      if (addable && cfg.fields) {
        act.appendChild(el('button', { class: 'btn btn-primary', html: icon('plus') + ' ' + (cfg.addText || '新增'), onClick: () => openForm(null) }));
      }
      return h;
    }
    function btnFrom(a) {
      const b = el('button', { class: 'btn ' + (a.cls || ''), html: (a.icon ? icon(a.icon) + ' ' : '') + a.label, onClick: a.onClick });
      return b;
    }

    function filterBar() {
      if (!cfg.filters || !cfg.filters.length) return null;
      const bar = el('div', { class: 'filter-bar' });
      cfg.filters.forEach(f => {
        const fi = el('div', { class: 'filter-item' }, [el('label', { text: f.label })]);
        let c;
        if (f.type === 'select') {
          c = el('select');
          c.appendChild(el('option', { value: '', text: '全部' }));
          optionsArr(f.options).forEach(o => c.appendChild(el('option', { value: o.value, text: o.label })));
        } else if (f.type === 'date') { c = el('input', { type: 'date' }); }
        else { c = el('input', { placeholder: f.placeholder || '关键字' }); }
        c.value = state.filters[f.field] || '';
        c.addEventListener('input', () => { state.filters[f.field] = c.value; state.page = 1; render(); });
        c.addEventListener('change', () => { state.filters[f.field] = c.value; state.page = 1; render(); });
        fi.appendChild(c); bar.appendChild(fi);
      });
      const fa = el('div', { class: 'filter-actions' }, [
        el('button', { class: 'btn btn-primary btn-sm', html: icon('search') + ' 查询', onClick: render }),
        el('button', { class: 'btn btn-sm', html: icon('refresh') + ' 重置', onClick: () => { state.filters = {}; state.page = 1; render(); } })
      ]);
      bar.appendChild(fa);
      return bar;
    }

    function cellVal(col, row) {
      if (col.render) {
        const r = col.render(row[col.field], row);
        return r == null ? '—' : r;
      }
      if (col.badge) {
        const tone = typeof col.badge === 'function' ? col.badge(row[col.field], row) : col.badge;
        return badge(row[col.field], tone);
      }
      const v = row[col.field];
      return v == null || v === '' ? '—' : String(v);
    }

    function tableBlock(rows) {
      const wrap = el('div', { class: 'table-wrap' });
      const tool = el('div', { class: 'table-tool' }, [
        el('span', { class: 't', text: cfg.tableTitle || cfg.title }),
        el('span', { class: 'small muted', text: '共 ' + rows.length + ' 条' })
      ]);
      wrap.appendChild(tool);
      const scroll = el('div', { class: 'table-scroll' });
      const t = el('table', { class: 'dt' });
      const thead = el('tr');
      cfg.columns.forEach(c => thead.appendChild(el('th', { text: c.title, style: c.width ? { width: c.width } : {} })));
      if (cfg.actions && cfg.actions.length) thead.appendChild(el('th', { class: 'col-act', text: '操作', style: { width: cfg.actWidth || '150px' } }));
      const theadWrap = el('thead'); theadWrap.appendChild(thead); t.appendChild(theadWrap);
      const tbody = el('tbody');
      const pageRows = rows.slice((state.page - 1) * pageSize, state.page * pageSize);
      if (!pageRows.length) {
        const tr = el('tr'), td = el('td', { colspan: cfg.columns.length + (cfg.actions ? 1 : 0) });
        td.appendChild(empty(cfg.emptyText || '未查询到符合条件的记录'));
        tr.appendChild(td); tbody.appendChild(tr);
      }
      pageRows.forEach(row => {
        const tr = el('tr', { class: cfg.rowClass ? cfg.rowClass(row) : '' });
        cfg.columns.forEach(c => {
          const td = el('td');
          const cv = cellVal(c, row);
          if (cv.nodeType) td.appendChild(cv); else td.innerHTML = cv;
          if (c.click) td.style.cursor = 'pointer', td.addEventListener('click', () => c.click(row));
          tr.appendChild(td);
        });
        if (cfg.actions && cfg.actions.length) {
          const td = el('td', { class: 'col-act' });
          cfg.actions.forEach(a => {
            if (a.show && !a.show(row)) return;
            const lk = el('span', { class: 'act-link' + (a.tone === 'danger' ? ' danger' : ''), text: a.label });
            lk.addEventListener('click', e => { e.stopPropagation(); a.onClick(row, render); });
            td.appendChild(lk);
          });
          tr.appendChild(td);
        }
        if (cfg.rowClick) tr.addEventListener('click', () => cfg.rowClick(row, render));
        tbody.appendChild(tr);
      });
      t.appendChild(tbody);
      scroll.appendChild(t); wrap.appendChild(scroll);
      if (rows.length > pageSize) wrap.appendChild(pager(rows.length));
      return wrap;
    }
    function pager(total) {
      const pages = Math.ceil(total / pageSize);
      const p = el('div', { class: 'pager' }, [el('span', { text: '第 ' + state.page + '/' + pages + ' 页' })]);
      const prev = el('button', { html: '‹', disabled: state.page === 1 });
      prev.addEventListener('click', () => { state.page--; render(); });
      p.appendChild(prev);
      const maxBtn = Math.min(pages, 7);
      let start = Math.max(1, Math.min(state.page - 3, pages - maxBtn + 1));
      for (let i = 0; i < maxBtn; i++) {
        const n = start + i;
        const b = el('button', { class: n === state.page ? 'cur' : '', text: n });
        b.addEventListener('click', () => { state.page = n; render(); });
        p.appendChild(b);
      }
      const next = el('button', { html: '›', disabled: state.page === pages });
      next.addEventListener('click', () => { state.page++; render(); });
      p.appendChild(next);
      return p;
    }

    function openForm(row) {
      const isEdit = !!row;
      const f = renderForm(cfg.fields, row ? U.clone(row) : (cfg.defaultRec || {}));
      const m = modal({
        title: (isEdit ? '编辑' : '新增') + (cfg.formTitle || cfg.title),
        icon: isEdit ? 'edit' : 'plus', size: cfg.formSize || '', body: f.el,
        okText: '保存',
        onOk: (body, close) => {
          if (!f.validate()) return;
          const rec = f.rec();
          if (cfg.onBeforeSave && cfg.onBeforeSave(rec, isEdit ? 'edit' : 'add', row) === false) return;
          if (cfg.table) {
            if (isEdit) SMS.store.update(cfg.table, row.id, rec);
            else SMS.store.insert(cfg.table, rec);
          }
          if (cfg.onSaved) cfg.onSaved(rec, isEdit ? 'edit' : 'add', row);
          toast((isEdit ? '已更新' : '已新增') + cfg.title, 'ok');
          close(); render();
        }
      });
    }
    function openDetail(row) {
      if (!cfg.detail) return;
      const d = cfg.detail;
      const body = el('div');
      const items = (d.fields || cfg.fields || []);
      if (items) {
        body.appendChild(descList(items.map(f => ({
          label: f.label || f.field, value: row[f.field], full: f.span === 2 || f.type === 'textarea'
        }))));
      }
      if (d.render) { const r = d.render(row); if (r) body.appendChild(el('div', { class: 'mt' }, [r])); }
      modal({ title: (typeof d.title === 'function' ? d.title(row) : d.title) || (cfg.title + '详情'), icon: 'eye', size: d.size || 'lg', body, footer: d.footer });
    }

    function doExport() {
      const rows = getData();
      U.exportCSV(cfg.title + '.csv', cfg.columns, rows);
      toast('已导出 CSV', 'ok');
    }

    function render() {
      U.clear(root);
      root.appendChild(head());
      const fb = filterBar(); if (fb) root.appendChild(fb);
      if (cfg.above) { const a = cfg.above(); if (a) root.appendChild(a); }
      const rows = getData();
      root.appendChild(tableBlock(rows));
      if (cfg.below) { const b = cfg.below(rows); if (b) root.appendChild(b); }
      return root;
    }

    // 默认行点击=详情
    if (cfg.rowClick === undefined && cfg.detail) cfg.rowClick = (row) => openDetail(row);

    root.appendChild(render());
    return { el: root, render };
  }

  /* ============ 导出 ============ */
  SMS.ui = {
    el, icon, PATHS, toast, modal, renderForm, crudPage, badge, levelBadge, progress, statCard,
    tabs, timeline, approvalSteps, chart, baseOption, empty, descList, PALETTE, LEVEL_COLORS, optionsArr
  };
  window.SMS = SMS;
})();


/* ===== core/router.js ===== */
/* =====================================================================
   core/router.js — 模块注册 + 哈希路由 + 导航分组
   registerModule({id, menus:[{group,name,icon,route,roles,order}],
                   routes:[{path,name,roles,render}]})
   ===================================================================== */
(function () {
  'use strict';
  const SMS = window.SMS || (window.SMS = {});
  const U = SMS.util;
  const el = U.el;

  /* 导航分组（顺序即展示顺序；仅当组内有可见菜单时显示） */
  const GROUPS = [
    { key: 'home', name: '首页', icon: 'dashboard' },
    { key: 'workbench', name: '工作台', icon: 'home' },
    { key: 'policy', name: '安全政策与目标', icon: 'policy' },
    { key: 'risk', name: '安全风险管理', icon: 'risk' },
    { key: 'assurance', name: '安全保证', icon: 'shield' },
    { key: 'promotion', name: '安全促进', icon: 'graduation' },
    { key: 'permit', name: '机场通行证', icon: 'id' },
    { key: 'capability', name: '保障能力评估', icon: 'star' },
    { key: 'service', name: '服务管理', icon: 'headset' },
    { key: 'emergency', name: '应急救援', icon: 'siren' },
    { key: 'mobile', name: '移动端', icon: 'mobile' },
    { key: 'master', name: '基础信息', icon: 'database' },
    { key: 'system', name: '系统管理', icon: 'gear' }
  ];

  const modules = [];
  const routes = [];
  let contentEl = null;
  let current = null;

  function registerModule(def) {
    modules.push(def);
    (def.routes || []).forEach(r => routes.push(Object.assign({ moduleId: def.id }, r)));
  }

  function matchRoute(path) {
    const segs = path.split('/').filter(Boolean);
    for (const r of routes) {
      const rsegs = r.path.split('/').filter(Boolean);
      if (rsegs.length !== segs.length) continue;
      const params = {}; let ok = true;
      for (let i = 0; i < rsegs.length; i++) {
        if (rsegs[i].startsWith(':')) params[rsegs[i].slice(1)] = decodeURIComponent(segs[i]);
        else if (rsegs[i] !== segs[i]) { ok = false; break; }
      }
      if (ok) return { def: r, params };
    }
    return null;
  }

  /* 收集当前用户可见的菜单 */
  function visibleMenus() {
    const list = [];
    modules.forEach(m => (m.menus || []).forEach(menu => {
      const routeDef = routes.find(r => r.path === menu.route);
      if (SMS.auth.canRoute(routeDef || { roles: menu.roles })) list.push(menu);
    }));
    return list;
  }

  function buildSidebar() {
    const nav = U.qs('.side-nav');
    U.clear(nav);
    const menus = visibleMenus();
    GROUPS.forEach(g => {
      const items = menus.filter(m => m.group === g.key).sort((a, b) => (a.order || 99) - (b.order || 99));
      if (!items.length) return;
      const grp = el('div', { class: 'nav-group' }, [
        el('div', { class: 'grp-title', html: SMS.ui.icon(g.icon, 14) + ' ' + g.name })
      ]);
      items.forEach(it => {
        const item = el('div', { class: 'nav-item', dataset: { route: it.route } }, [
          el('span', { class: 'nicon', html: SMS.ui.icon(it.icon || g.icon, 15) }),
          el('span', { text: it.name })
        ]);
        item.addEventListener('click', () => go(it.route));
        grp.appendChild(item);
      });
      nav.appendChild(grp);
    });
    highlight();
  }

  function highlight() {
    const path = currentPath();
    U.qsa('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.route === path));
  }

  function currentPath() {
    const h = location.hash.replace(/^#\/?/, '');
    return h.split('/').length >= 2 ? h.split('/').slice(0, 2).join('/') : h;
  }

  function setCrumb(matched) {
    const bar = U.qs('.crumb');
    if (!bar) return;
    U.clear(bar);
    const g = GROUPS.find(x => x.key === (matched.def.group || ''));
    bar.appendChild(el('span', { text: 'SMS' }));
    if (g) { bar.appendChild(el('span', { text: '/' })); bar.appendChild(el('span', { text: g.name })); }
    bar.appendChild(el('span', { text: '/' }));
    bar.appendChild(el('span', { class: 'cur', text: matched.def.name || matched.def.path }));
  }

  function render() {
    const path = location.hash.replace(/^#\/?/, '') || 'home/company';
    const matched = matchRoute(path);
    if (!matched) {
      U.clear(contentEl);
      contentEl.appendChild(SMS.ui.empty('页面不存在（404）', '请从左侧菜单进入功能页面'));
      return;
    }
    if (!SMS.auth.canRoute(matched.def)) {
      U.clear(contentEl);
      const e = SMS.ui.empty('无访问权限（403）', '当前角色无权访问该页面，可在顶部切换角色');
      contentEl.appendChild(e);
      setCrumb(matched);
      return;
    }
    current = matched;
    U.clear(contentEl);
    const node = matched.def.render({ params: matched.params, route: matched.def });
    if (node) contentEl.appendChild(node.nodeType ? node : (function(){const w=el('div');w.appendChild(node);return w;})());
    setCrumb(matched);
    highlight();
    window.scrollTo(0, 0);
  }

  function go(path) {
    if (('#/' + path) === location.hash) render();
    else location.hash = '#/' + path;
  }
  function refresh() { render(); }

  function mount(el2) { contentEl = el2; window.addEventListener('hashchange', render); }

  SMS.registerModule = registerModule;
  SMS.router = { mount, go, refresh, render, GROUPS, modules, visibleMenus, buildSidebar, matchRoute, current: () => current };
  window.SMS = SMS;
})();

        自愿·强制报告 / 安全通告 / 待办 / 培训与考试 / 字典
   风险分级（默认、可配置）：

     10-15 高度 / 16-25 不可接受

(function () {

    if (v <= 9) return { level: '中度', tone: 'yellow', accept: '缓解后可接受' };
    if (v <= 15) return { level: '高度', tone: 'orange', accept: '不可接受' };
    return { level: '不可接受', tone: 'red', accept: '不可接受' };
  }
  function hz(o) {

  const departments = [

    { id: 'dept-eq', name: '设备信息部', parentId: 'dept-root', level: 1, deptType: '职能', leader: '王运维' },
    { id: 'dept-er', name: '应急救援部', parentId: 'dept-root', level: 1, deptType: '一线', leader: '雷急救' },

  /* ================= 2. 岗位 ================= */
  const posts = [

    { id: 'post-sm', name: '安全总监(安全经理)', deptId: 'dept-aq', important: true },
